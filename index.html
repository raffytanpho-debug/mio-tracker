    </div>
  `);
}

async function saveWord() {
  if (!_wordEdit) return;
  const w = (data.words||[]).find(x => x.id === _wordEdit);
  if (!w) { closeModal(); return; }
  const word = (document.getElementById('we-word')?.value || '').trim();
  if (!word) { toast("Word can't be empty."); return; }
  w.word     = word;
  w.meaning  = (document.getElementById('we-meaning')?.value || '').trim();
  w.language = document.getElementById('we-lang')?.value || w.language;
  w.category = _wordDraftCat || 'other';
  w.clarity  = _wordDraftClarity || null;
  const fh = document.getElementById('we-date')?.value;
  if (fh) w.firstHeard = fh;
  _wordEdit = null;
  await save();
  closeModal();
  renderView();
  toast('Word updated.');
}

function askDeleteWord(id) {
  openModal(`
    <div class="mdh"></div>
    <div class="mdt">Delete this word?</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5">It will be removed from Mio's list. You can always add it again later.</div>
    <button onclick="confirmDeleteWord('${id}')" style="width:100%;padding:13px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn-tx);margin-bottom:8px">Delete</button>
    <button onclick="openWordModal('${id}')" style="width:100%;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;background:none;border:1px solid var(--border);color:var(--muted)">Keep it</button>
  `);
}

// Record a tombstone so sync-merge doesn't resurrect a deleted item.
function tombstone(id) {
  if (!id) return;
  if (!data.deletedIds) data.deletedIds = [];
  if (!data.deletedIds.includes(id)) data.deletedIds.push(id);
}

async function confirmDeleteWord(id) {
  data.words = (data.words||[]).filter(w => w.id !== id);
  tombstone(id);
  _wordEdit = null;
  await save();
  closeModal();
  renderView();
  toast('Word deleted.');
}

// ═══ MILESTONES VIEW ══════════════════════════════════════════════════════
function buildMilestones() {
  const DLABELS = { language:'Language', cognitive:'Cognitive', social_emotional:'Social & Emotional', motor_gross:'Gross Motor', motor_fine:'Fine Motor', adaptive:'Self-Help' };
  const DICONS  = { language:'🗣', cognitive:'🧠', social_emotional:'❤️', motor_gross:'🏃', motor_fine:'✋', adaptive:'🍽' };
  const domains = ['language','cognitive','social_emotional','motor_gross','motor_fine','adaptive'];

  const reached = CDC_ITEMS.filter(ci => (data.milestones||[]).find(m => m.item === ci.item)?.status === 'reached').length;
  const total   = CDC_ITEMS.length;
  const pct     = Math.round((reached / total) * 100);

  function statusChip(status) {
    if (status === 'reached')    return `<span style="padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.3);white-space:nowrap;flex-shrink:0">✓ Yes</span>`;
    if (status === 'attempting') return `<span style="padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(227,179,65,.15);color:var(--yellow);border:1px solid rgba(227,179,65,.3);white-space:nowrap;flex-shrink:0">~ Trying</span>`;
    if (status === 'not-yet')    return `<span style="padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--border);white-space:nowrap;flex-shrink:0">Not yet</span>`;
    return `<span style="padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;background:var(--surface2);color:var(--border);border:1px solid var(--border);white-space:nowrap;flex-shrink:0">—</span>`;
  }

  const domainSections = domains.map(domain => {
    const items = CDC_ITEMS.filter(x => x.domain === domain);
    const dReached = items.filter(ci => (data.milestones||[]).find(m => m.item === ci.item)?.status === 'reached').length;
    const speechPin = domain === 'language'
      ? `<span style="font-size:10px;background:rgba(88,166,255,.15);color:var(--blue);border:1px solid rgba(88,166,255,.3);padding:2px 7px;border-radius:10px;font-weight:700;margin-left:7px">📍 Focus</span>`
      : '';
    return `
      <div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px;margin:14px 0 8px">
          <div style="font-size:12px;font-weight:700;color:var(--accent-l)">${DICONS[domain]} ${DLABELS[domain]}${speechPin}</div>
          <div style="font-size:11px;color:var(--muted)">${dReached}/${items.length}</div>
        </div>
        ${domain === 'language' ? `<div style="font-size:11px;color:var(--muted);line-height:1.5;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:9px 11px;margin:0 0 8px">
          Slower expressive speech is common at this age (it affects roughly 1 in 7 toddlers), and many children catch up on their own. Because some don't, and it's hard to predict which, it's worth tracking here and mentioning to the pediatrician. Strong understanding of words is a reassuring sign.
        </div>` : ''}
        ${items.map(ci => {
          const idx = CDC_ITEMS.indexOf(ci);
          const ms  = (data.milestones||[]).find(m => m.item === ci.item);
          return `<div onclick="openMsModal(${idx})" style="background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:11px 13px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer">
            <div style="font-size:13px;font-weight:600;line-height:1.4;flex:1">${esc(ci.item)}</div>
            ${statusChip(ms?.status)}
          </div>`;
        }).join('')}
      </div>`;
  }).join('');

  return `
    <div style="padding:12px 13px 0">
      <div class="card" style="margin-bottom:4px">
        <div class="card-title">CDC 18-Month Checklist</div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div><span style="font-size:26px;font-weight:800;color:var(--accent-l)">${reached}</span><span style="font-size:13px;color:var(--muted)"> / ${total} reached</span></div>
          <div style="font-size:11px;color:var(--muted)">Tap any item to update</div>
        </div>
        <div style="height:6px;border-radius:3px;background:var(--border);overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:3px"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);line-height:1.5;margin-top:9px">
          Each item is something most children (about 75%) do by this age, per the CDC. It's a guide for what to watch and talk about, not a test, and not a substitute for your pediatrician's screening.
        </div>
      </div>
      ${domainSections}
    </div>
    <div class="gap"></div>
  `;
}

function openMsModal(itemIdx) {
  _msEditItem = CDC_ITEMS[itemIdx];
  if (!_msEditItem) return;
  const ms  = (data.milestones||[]).find(m => m.item === _msEditItem.item);
  const cur = ms?.status;
  const MS_OPTS = [
    { status:'reached',    label:'✓ Reached', color:'var(--green)',  bg:'rgba(63,185,80,.15)',  border:'rgba(63,185,80,.4)'  },
    { status:'attempting', label:'~ Trying',  color:'var(--yellow)', bg:'rgba(227,179,65,.15)', border:'rgba(227,179,65,.4)' },
    { status:'not-yet',    label:'✗ Not yet', color:'var(--muted)',  bg:'rgba(125,133,144,.1)', border:'var(--border)'       },
  ];
  const btns = MS_OPTS.map(o => {
    const on = cur === o.status;
    return `<button onclick="saveMsStatus('${o.status}')"
      style="width:100%;padding:13px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:8px;
        border:1.5px solid ${on?o.border:'var(--border)'};background:${on?o.bg:'var(--surface2)'};color:${on?o.color:'var(--text)'}">${o.label}</button>`;
  }).join('');
  openModal(`
    <div class="mdh"></div>
    <div class="mdt">Update Milestone</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5">${esc(_msEditItem.item)}</div>
    ${btns}
    <button onclick="closeModal()" style="width:100%;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;background:none;border:1px solid var(--border);color:var(--muted);margin-top:2px">Cancel</button>
  `);
}

async function saveMsStatus(status) {
  if (!_msEditItem) return;
  const ci = _msEditItem;
  if (!data.milestones) data.milestones = [];
  const ex = data.milestones.find(m => m.item === ci.item);
  if (ex) { ex.status = status; ex.date = today(); ex.ageMonths = ageMonths(data.child?.dob||MIO_DOB); }
  else data.milestones.push({ id:uid(), date:today(), ageMonths:ageMonths(data.child?.dob||MIO_DOB), domain:ci.domain, item:ci.item, status, note:'' });
  await save();
  closeModal();
  renderView();
  toast('Milestone updated.');
}

// ═══ GROWTH VIEW ══════════════════════════════════════════════════════════
function buildGrowth() {
  const growthData = (data.growth || []).slice().sort((a,b) => a.date.localeCompare(b.date));
  const dob = data.child?.dob || MIO_DOB;

  function metricCard(label, field, table, unit, tableNote) {
    const entries = growthData.filter(g => g[field] != null);
    if (!entries.length) return '';
    const last     = entries[entries.length-1];
    const band     = getBandInfo(last.ageMonths, last[field], table);
    const crossing = checkBandCrossing(growthData, field, table);
    return `
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px">
          <div>
            <div class="card-title" style="margin-bottom:3px">${label}</div>
            <div style="font-size:24px;font-weight:800">${last[field]} <span style="font-size:12px;font-weight:400;color:var(--muted)">${unit}</span></div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">${last.date} · ${last.ageMonths}mo</div>
          </div>
          ${band ? `<div style="text-align:right;padding-top:2px">
            <div style="font-size:10px;color:var(--muted);margin-bottom:3px">WHO band</div>
            <div style="font-size:15px;font-weight:800;color:${band.color}">${band.band}</div>
          </div>` : ''}
        </div>
        ${crossing ? `<div style="background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:var(--rs);padding:9px 11px;margin-bottom:10px;font-size:12px;color:var(--warn-tx);line-height:1.5">
          This measurement moved across more than one band (${esc(crossing.from)} → ${esc(crossing.to)}). Re-check the measurement, and mention it to the pediatrician if it holds. A single change like this is often normal and isn't something to read on its own.
        </div>` : ''}
        ${tableNote ? `<div style="font-size:11px;color:var(--muted);margin-bottom:8px;font-style:italic">${tableNote}</div>` : ''}
        ${buildWhoChart(growthData, field, table, unit)}
        ${entries.length > 1 ? `
        <div style="border-top:1px solid var(--border);margin-top:10px;padding-top:8px">
          ${entries.slice().reverse().slice(0,5).map(g => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:12px">
              <span style="color:var(--muted)">${g.date} <span style="font-size:10px">(${g.ageMonths}mo)</span></span>
              <div style="display:flex;align-items:center;gap:6px">
                <span style="font-weight:700">${g[field]} ${unit}</span>
                <button onclick="confirmDeleteGrowth('${g.id}')" style="background:none;border:none;color:var(--muted);opacity:.6;cursor:pointer;font-size:16px;padding:0;line-height:1">×</button>
              </div>
            </div>`).join('')}
        </div>` : ''}
      </div>`;
  }

  const hasData = growthData.length > 0;

  return `
    <div style="padding:12px 13px 0">

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-size:13px;color:var(--muted)">${growthData.length} measurement${growthData.length!==1?'s':''} logged</div>
        <button onclick="openGrowthModal()" style="background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--rs);padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">+ Add</button>
      </div>

      ${hasData ? `<div style="font-size:12px;color:var(--muted);line-height:1.55;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;margin-bottom:10px">
        Percentiles compare Mio with other children the same age and sex. They are a position, not a grade, and there is no "better" end of the range. What matters most is the pattern over time, not any single point.
      </div>` : ''}

      ${!hasData ? `
      <div class="card" style="text-align:center;padding:28px 16px;margin-bottom:10px">
        <div style="font-size:40px;margin-bottom:10px">📏</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:8px">No measurements yet</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6">Add weight, height, or head circumference. Plotted against WHO boys' percentile bands (P3 → P97).</div>
        <button onclick="openGrowthModal()" style="background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--rs);padding:12px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Add first measurement</button>
      </div>` : `
      ${metricCard('Weight','weightKg',WHO_WT_B,'kg',null)}
      ${metricCard('Length / Height','heightCm',WHO_LN_B,'cm', ageMonths(dob) < 24 ? 'Recumbent length reference (WHO, 0–24mo)' : null)}
      ${metricCard('Head Circumference','headCm',WHO_HC_B,'cm',null)}
      `}

      <div style="margin-bottom:14px;padding:10px 12px;background:rgba(88,166,255,.07);border:1px solid rgba(88,166,255,.15);border-radius:var(--rs);font-size:11px;color:rgba(88,166,255,.8);line-height:1.6">
        ℹ️ Percentile bands from WHO Child Growth Standards (2006), boys. Reference values only — not for clinical decisions. Share with Mio's pediatrician for interpretation.
      </div>

    </div>
    <div class="gap"></div>
  `;
}

function openGrowthModal() {
  openModal(`
    <div class="mdh"></div>
    <div class="mdt">Add Measurement</div>
    <div class="mf">
      <div class="ml">Date</div>
      <input class="mi" id="gDate" type="date" value="${today()}">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
      <div><div class="ml">Weight (kg)</div><input class="mi" id="gWt" type="number" step="0.01" inputmode="decimal" placeholder="e.g. 11.2"></div>
      <div><div class="ml">Height (cm)</div><input class="mi" id="gHt" type="number" step="0.1"  inputmode="decimal" placeholder="e.g. 84"></div>
      <div><div class="ml">Head (cm)</div><input class="mi"  id="gHd" type="number" step="0.1"  inputmode="decimal" placeholder="e.g. 47"></div>
    </div>
    <div class="mf">
      <div class="ml">Note (optional)</div>
      <input class="mi" id="gNote" placeholder="e.g. well-child visit">
    </div>
    <div class="ma">
      <button onclick="closeModal()" class="mb cancel">Cancel</button>
      <button onclick="saveGrowthEntry()" class="mb primary">Save</button>
    </div>
  `);
}

async function saveGrowthEntry() {
  const dateVal = document.getElementById('gDate')?.value || today();
  const wt   = parseFloat(document.getElementById('gWt')?.value);
  const ht   = parseFloat(document.getElementById('gHt')?.value);
  const hd   = parseFloat(document.getElementById('gHd')?.value);
  const note = (document.getElementById('gNote')?.value || '').trim();
  if (!wt && !ht && !hd) { toast('Enter at least one measurement.'); return; }
  const mo = ageMonthsAt(data.child?.dob || MIO_DOB, dateVal);
  if (!data.growth) data.growth = [];
  data.growth.push({ id:uid(), date:dateVal, ageMonths:mo, weightKg:wt||null, heightCm:ht||null, headCm:hd||null, note });
  await save();
  closeModal();
  renderView();
  toast('Measurement saved.');
}

function confirmDeleteGrowth(id) {
  openModal(`
    <div class="mdh"></div>
    <div class="mdt">Delete this entry?</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px">This can't be undone.</div>
    <div class="ma">
      <button onclick="closeModal()" class="mb cancel">Keep it</button>
      <button onclick="deleteGrowthEntry('${id}')" class="mb danger">Delete</button>
    </div>
  `);
}

async function deleteGrowthEntry(id) {
  data.growth = (data.growth||[]).filter(g => g.id !== id);
  tombstone(id);
  await save();
  closeModal();
  renderView();
  toast('Entry deleted.');
}

// ═══ TRENDS VIEW ══════════════════════════════════════════════════════════
function buildTrends() {
  const words     = (data.words || []).slice().sort((a,b) => (b.firstHeard||'').localeCompare(a.firstHeard||''));
  const wellbeing = (data.wellbeing || []).slice().sort((a,b) => a.date.localeCompare(b.date));

  // Last 14 calendar days
  const DAYS = Array.from({length:14}, (_,i) => {
    const d = new Date(); d.setDate(d.getDate() - (13 - i));
    return d.toISOString().slice(0,10);
  });
  const wbByDate = {};
  for (const wb of wellbeing) wbByDate[wb.date] = wb;
  const checkinDone = DAYS.filter(d => wbByDate[d]).length;

  // Language breakdown
  const byLang = {};
  for (const w of data.words||[]) byLang[w.language||'Other'] = (byLang[w.language||'Other']||0)+1;
  const langStr = Object.entries(byLang).map(([l,c]) => `${c} ${l}`).join(' · ') || '—';

  // Color + height maps
  const SLEEP_C  = { lt9:'var(--red)', '9to11':'var(--yellow)', '11to14':'var(--green)', gt14:'var(--blue)' };
  const SLEEP_H  = { lt9:8, '9to11':16, '11to14':32, gt14:24 };
  const ACTIVE_C = { little:'var(--red)', '1h':'var(--yellow)', lots:'var(--green)', lots_out:'var(--accent-l)' };
  const ACTIVE_H = { little:8, '1h':16, lots:28, lots_out:32 };
  const MOOD_C   = { happy:'var(--green)', mixed:'var(--yellow)', fussy:'var(--red)' };

  function barRow(label, valFn, cFn, hFn) {
    const bars = DAYS.map(d => {
      const wb = wbByDate[d]; const v = wb ? valFn(wb) : null;
      return `<div style="flex:1;border-radius:2px 2px 0 0;height:${v ? hFn(v) : 3}px;background:${v ? cFn(v) : 'var(--border)'};align-self:flex-end"></div>`;
    }).join('');
    return `<div style="margin-bottom:12px">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:5px">${label}</div>
      <div style="display:flex;gap:2px;align-items:flex-end;height:34px">${bars}</div>
    </div>`;
  }

  function dotRow(label, colorFn) {
    const dots = DAYS.map(d => {
      const wb = wbByDate[d];
      const c  = wb ? (colorFn(wb) || 'var(--border)') : 'var(--surface2)';
      return `<div style="flex:1;height:10px;border-radius:2px;background:${c}"></div>`;
    }).join('');
    return `<div style="margin-bottom:12px">
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin-bottom:5px">${label}</div>
      <div style="display:flex;gap:2px;align-items:center">${dots}</div>
    </div>`;
  }

  const dayLabelRow = `<div style="display:flex;gap:2px;margin-top:3px">
    ${DAYS.map(d => {
      const isToday = d === today();
      const lbl = new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'narrow'});
      return `<div style="flex:1;text-align:center;font-size:8px;color:${isToday?'var(--accent-l)':'var(--muted)'};font-weight:${isToday?700:400}">${lbl}</div>`;
    }).join('')}
  </div>`;

  return `
    <div style="padding:12px 13px 0">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div class="scard" onclick="sv('words')" style="cursor:pointer">
          <div class="s-lbl">Words ›</div>
          <div class="s-val" style="color:var(--accent-l)">${words.length}</div>
          <div class="s-sub">${langStr}</div>
        </div>
        <div class="scard">
          <div class="s-lbl">Check-ins</div>
          <div class="s-val" style="color:var(--blue)">${checkinDone}<span style="font-size:11px;font-weight:400;color:var(--muted)">/14</span></div>
          <div class="s-sub">last 14 days</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:10px">
        <div class="card-title">Last 14 days · ${checkinDone} check-in${checkinDone!==1?'s':''} logged</div>
        ${checkinDone === 0
          ? `<div style="text-align:center;padding:18px 0 10px">
              <div style="font-size:28px;margin-bottom:8px">📅</div>
              <div style="font-size:14px;font-weight:700;margin-bottom:5px">No check-ins yet</div>
              <div style="font-size:12px;color:var(--muted);line-height:1.6">The daily check-in fills these bars automatically. Open the app each day and tap through the quick prompts.</div>
            </div>`
          : `${barRow('Sleep · 🟢 11–14h target', wb=>wb.sleepBand, v=>SLEEP_C[v]||'var(--border)', v=>SLEEP_H[v]||6)}
        ${dayLabelRow}
        <div style="height:10px"></div>
        ${barRow('Active play · 🟢 lots', wb=>wb.activeBand, v=>ACTIVE_C[v]||'var(--border)', v=>ACTIVE_H[v]||6)}
        ${dotRow('Mood · 🟢 happy 🟡 mixed 🔴 fussy', wb=>wb.mood ? MOOD_C[wb.mood] : null)}
        ${dotRow('Read together · 🟢 yes', wb=>wb.readTogether === true ? 'var(--green)' : wb.readTogether === false ? 'rgba(125,133,144,.2)' : null)}`}
      </div>

    </div>
    <div class="gap"></div>
  `;
}

// ═══ ADVISOR VIEW ═════════════════════════════════════════════════════════
function buildAdvisorSystemPrompt() {
  const dob  = data.child?.dob || MIO_DOB;
  const mo   = ageMonths(dob);
  const y    = Math.floor(mo/12), rem = mo % 12;
  const ageL = y > 0 ? `${y}y ${rem}mo` : `${mo} months`;
  const words = data.words || [];
  const wc    = words.length;
  const wSamp = words.slice(0,8).map(w => `"${w.word}"${w.meaning?' ('+w.meaning+')':''}`).join(', ');
  const ms    = data.milestones || [];
  const rea   = ms.filter(m=>m.status==='reached').map(m=>m.item).join('; ')||'none logged';
  const try_  = ms.filter(m=>m.status==='attempting').map(m=>m.item).join('; ')||'none';
  const nyt   = ms.filter(m=>m.status==='not-yet').map(m=>m.item).join('; ')||'none';
  const wb7   = (data.wellbeing||[]).filter(w=>w.date>=sevenDaysAgo());
  const SLEEP_L={lt9:'<9h','9to11':'9–11h','11to14':'11–14h',gt14:'>14h'};
  const ACT_L  ={little:'little','1h':'~1h',lots:'lots',lots_out:'lots+outdoors'};
  const MOOD_L ={happy:'happy',mixed:'mixed',fussy:'fussy'};
  const wbSum = wb7.length===0 ? 'No recent check-ins.' :
    `${wb7.length} check-ins (last 7d). Sleep: ${summarizeBands(wb7,'sleepBand',SLEEP_L)}. Mood: ${summarizeBands(wb7,'mood',MOOD_L)}. Active: ${summarizeBands(wb7,'activeBand',ACT_L)}.`;
  const lg    = (data.growth||[]).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const gwth  = lg
    ? `${lg.date} (${lg.ageMonths}mo): ${[lg.weightKg&&lg.weightKg+'kg',lg.heightCm&&lg.heightCm+'cm',lg.headCm&&'HC '+lg.headCm+'cm'].filter(Boolean).join(', ')}`
    : 'None logged.';
  const langs = (data.child?.languages||['Filipino','English']).join(' + ');

  return `You are a warm, honest development companion for Mio's parents. You draw on CDC, AAP/HealthyChildren, WHO, ASHA, and the Nurturing Care Framework.

HARD RULES — never break these:
• Never diagnose. Never predict outcomes. You are not a doctor.
• Route any clinical concern to Mio's pediatrician. End clinical answers with: "Worth raising with Mio's pediatrician."
• Cite sources (CDC, AAP, WHO, ASHA) for developmental claims. Label uncited statements as general knowledge.
• Be honest: never falsely reassure, never alarm without basis. State where Mio sits AND note the wide normal variation.
• On speech: always note that strong comprehension is a positive sign — receptive language is one of the best predictors of expressive outcomes (ASHA).

MIO RIGHT NOW — ${ageL} old, born ${dob}:
Words: ${wc} across all languages${wc>0?' — '+wSamp+(wc>8?' + more':''):''}
Milestones reached: ${rea}
Trying: ${try_}
Not yet: ${nyt}
Recent wellbeing: ${wbSum}
Latest growth: ${gwth}
Languages at home: ${langs}

KNOWLEDGE AREAS:
Speech/language: CDC/ASHA milestones, bilingual counts (all languages combined), expressive vs. receptive, serve-and-return, language-rich routines, reading aloud
Cognitive: object permanence, imitation, cause-effect, pretend play
Social-emotional: attachment, emotional regulation, parallel play, temperament
Motor: gross (walking/running/climbing), fine (grasping/stacking/scribbling)
Adaptive: feeding independence, cup drinking, sleep routines
Growth: WHO P3–P97 bands; flag 2+ crossings for pediatrician — never interpret
Wellbeing: sleep target 11–14h, active play ~3h, screen time, reading
Positive parenting: responsive caregiving, narrating daily life, reducing screens

ANSWER SHAPE — for any question about whether something is normal or concerning, structure the reply in plain prose covering, in this order: what this usually means at Mio's age, how settled or uncertain the evidence is, when it would be worth raising with the pediatrician, and the source(s) behind the answer. For simple or factual questions, answer directly without forcing the structure.
REFUSALS — when you can't answer because it needs a clinician (e.g. "is Mio delayed?"), don't stop at "I can't diagnose." Briefly say why (it depends on age, hearing, overall development, and direct assessment), then offer to help summarize what the parents have observed for the pediatrician.

Keep answers focused and parent-friendly. Avoid cheerleading and exclamation marks. Activities should be concrete and daily-doable.`;
}

function buildAdvisor() {
  const proxyUrl = (data.settings?.proxyUrl || '').trim();

  if (!proxyUrl) return `
    <div class="empty" style="padding-top:60px">
      <div class="empty-ico">💬</div>
      <div class="empty-txt">AI Advisor</div>
      <div class="empty-sub">Set your Claude Proxy URL in Settings first.</div>
    </div>
    <div style="margin:0 13px">
      <div class="card">
        <div class="card-title">How to enable</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:14px">Go to ⚙️ Settings → AI Advisor and paste in your Cloudflare Worker proxy URL.</div>
        <button onclick="sv('settings')" style="width:100%;padding:11px;background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Open Settings →</button>
      </div>
    </div>`;

  const STARTERS = [
    "What can we do to help Mio say more words?",
    "What milestones should Mio be hitting right now?",
    "How much sleep does a baby Mio's age need?",
    "What daily activities support speech at this age?",
  ];

  const bubbles = advisorMsgs.length === 0
    ? `<div style="text-align:center;padding:20px 0 16px">
        <div style="font-size:32px;margin-bottom:8px">💬</div>
        <div style="font-size:15px;font-weight:700;margin-bottom:5px">Ask me anything about Mio</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:16px">I know his age, words, milestones, and recent check-ins.</div>
        ${STARTERS.map(s=>`<button onclick="useAdvisorStarter(${JSON.stringify(s)})" style="display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;margin-bottom:7px;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit">${esc(s)}</button>`).join('')}
      </div>`
    : advisorMsgs.map(m => {
        const isUser = m.role === 'user';
        return `<div style="display:flex;justify-content:${isUser?'flex-end':'flex-start'};margin-bottom:6px">
          <div style="max-width:86%;padding:10px 13px;
            border-radius:${isUser?'16px 16px 4px 16px':'16px 16px 16px 4px'};
            background:${isUser?'var(--accent)':'var(--surface2)'};
            color:${isUser?'var(--on-accent)':'var(--text)'};
            font-size:14px;line-height:1.5;word-break:break-word;
            border:${isUser?'none':'1px solid var(--border)'}">${isUser?esc(m.content):renderMD(m.content)}</div>
        </div>`;
      }).join('') +
    (advisorBusy
      ? `<div style="display:flex;justify-content:flex-start;margin-bottom:6px">
          <div style="padding:11px 15px;border-radius:16px 16px 16px 4px;background:var(--surface2);border:1px solid var(--border)">
            <div style="display:flex;gap:5px;align-items:center;height:14px">
              <div style="width:7px;height:7px;border-radius:50%;background:var(--muted);animation:adot .9s ease infinite"></div>
              <div style="width:7px;height:7px;border-radius:50%;background:var(--muted);animation:adot .9s ease infinite .15s"></div>
              <div style="width:7px;height:7px;border-radius:50%;background:var(--muted);animation:adot .9s ease infinite .3s"></div>
            </div>
          </div>
        </div>`
      : '');

  const clearBtn = advisorMsgs.length > 0
    ? `<button onclick="clearAdvisorChat()" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit">Clear</button>`
    : '';

  return `
    <div style="padding:10px 13px 2px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:11px;color:var(--muted)">Knows Mio's age, words, milestones + check-ins</div>
      ${clearBtn}
    </div>
    <div id="chat-msgs" style="padding:6px 13px 80px">
      ${bubbles}
    </div>
    <div style="position:fixed;bottom:var(--nav-h);left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);padding:8px 13px;z-index:99">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea id="chat-inp" placeholder="Ask about Mio's development…"
          style="flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:9px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;resize:none;line-height:1.4;min-height:40px;max-height:110px;overflow-y:auto"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAdvisorMsg()}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px'"></textarea>
        <button onclick="sendAdvisorMsg()" ${advisorBusy?'disabled':''} style="background:${advisorBusy?'var(--border)':'var(--accent)'};color:var(--on-accent);border:none;border-radius:12px;padding:9px 14px;font-weight:700;cursor:${advisorBusy?'default':'pointer'};font-family:inherit;font-size:14px;flex-shrink:0;align-self:flex-end">Send</button>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:5px;text-align:center">Not a doctor · clinical questions routed to the pediatrician</div>
    </div>`;
}

function useAdvisorStarter(text) {
  const inp = document.getElementById('chat-inp');
  if (inp) { inp.value = text; inp.focus(); inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight,110)+'px'; }
}

async function sendAdvisorMsg() {
  if (advisorBusy) return;
  const inp = document.getElementById('chat-inp');
  const text = (inp?.value||'').trim();
  if (!text) return;
  const proxyUrl = (data.settings?.proxyUrl||'').trim();
  if (!proxyUrl) { toast('Set the Claude Proxy URL in Settings.'); sv('settings'); return; }

  advisorMsgs.push({ role:'user', content:text });
  if (inp) { inp.value=''; inp.style.height='auto'; }
  advisorBusy = true;
  renderView();
  scrollAdvisorToBottom();

  try {
    const res = await fetch(proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        system: buildAdvisorSystemPrompt(),
        messages: advisorMsgs.map(m => ({ role:m.role, content:m.content }))
      })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const r = await res.json();
    const reply = r.content?.[0]?.text || r.choices?.[0]?.message?.content || '';
    if (!reply) throw new Error('Empty response');
    advisorMsgs.push({ role:'assistant', content:reply });
  } catch(e) {
    advisorMsgs.push({ role:'assistant', content:"⚠️ Couldn't reach the advisor. Check your Proxy URL in Settings and try again." });
    console.warn('Advisor error:', e);
  }
  advisorBusy = false;
  renderView();
  scrollAdvisorToBottom();
}

function clearAdvisorChat() { advisorMsgs = []; renderView(); }

function scrollAdvisorToBottom() {
  setTimeout(() => { const c = document.getElementById('content'); if (c) c.scrollTop = c.scrollHeight; }, 80);
}

function copyAppLink() {
  navigator.clipboard.writeText(window.location.href).then(
    () => toast('App link copied — share it with your partner!'),
    () => { toast('Copy failed — share the URL manually.'); }
  );
}

async function saveProxyUrl() {
  const val = (document.getElementById('proxyInp')?.value || '').trim();
  if (!data.settings) data.settings = clone(DEF.settings);
  data.settings.proxyUrl = val;
  await save();
  toast('Proxy URL saved.');
}

// Refresh the Drive token when the app regains focus or the network returns,
// so a backgrounded/installed PWA recovers without showing the reconnect banner.
document.addEventListener('visibilitychange', () => { if (!document.hidden) maybeRefreshToken(); });
window.addEventListener('online', () => { maybeRefreshToken(); });

(async function init() {
  await openDB();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW registration failed:', e));
  }
  await launchApp();
})();
</script>
