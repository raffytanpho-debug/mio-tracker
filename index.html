<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>Mio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#161b22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mio">
  <link rel="apple-touch-icon" href="icon.svg">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg:#0d1117; --surface:#161b22; --surface2:#21262d; --border:#30363d;
      --text:#f0f6fc; --muted:#7d8590;
      --accent:#3fb950; --accent-l:#56d364;
      --green:#3fb950; --red:#f85149; --yellow:#e3b341; --blue:#58a6ff; --purple:#bc8cff;
      --nav-h:60px; --r:14px; --rs:10px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;overscroll-behavior:none}

    /* APP */
    #app{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    #header{background:linear-gradient(160deg,#112218 0%,#0d1117 60%);padding:14px 16px 16px;flex-shrink:0;border-bottom:1px solid var(--border)}
    #content{flex:1;overflow-y:auto;padding-bottom:var(--nav-h)}
    #nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100}

    /* HEADER */
    .drive-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);border-radius:8px;padding:7px 10px;margin-bottom:12px;font-size:12px;color:#ffa198}
    .drive-banner.ok{background:rgba(63,185,80,.1);border-color:rgba(63,185,80,.3);color:#7bc9a0}
    .drive-banner button{background:rgba(248,81,73,.25);border:none;border-radius:6px;color:#ffa198;font-size:11px;font-weight:700;padding:3px 8px;cursor:pointer}
    .hdr-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
    .hdr-name{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--text);margin:2px 0 3px}
    .hdr-age{font-size:13px;color:var(--accent-l);font-weight:600}

    /* NAV */
    .nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--muted);border:none;background:none;font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;transition:color .2s;padding:0}
    .nb.active{color:var(--accent-l)}
    .ni{font-size:18px;line-height:1}

    /* CARDS */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin:0 13px 10px}
    .card-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:11px;font-weight:700}

    /* STATS PAIR */
    .scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px}
    .s-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
    .s-val{font-size:21px;font-weight:800;margin:3px 0 2px;letter-spacing:-.5px}
    .s-sub{font-size:11px;color:var(--muted)}

    /* SETTINGS */
    .set-sec{padding:13px 13px 5px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
    .set-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px 13px;margin:0 13px 7px;display:flex;align-items:center;justify-content:space-between;gap:11px}
    .set-lbl{font-size:14px;font-weight:600}
    .set-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .set-inp{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .2s}
    .set-inp:focus{border-color:var(--accent-l)}
    .set-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
    .set-btn:hover{border-color:var(--accent-l);color:var(--accent-l)}
    .set-btn.ok{border-color:var(--green);color:var(--green)}
    .set-btn.danger{border-color:var(--red);color:var(--red)}

    /* MODAL */
    .mo{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
    .mo.hidden{display:none}
    .md{background:var(--surface);border-radius:22px 22px 0 0;padding:0 17px 30px;width:100%;max-width:430px;border-top:1px solid var(--border);max-height:90vh;overflow-y:auto}
    .mdh{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 17px}
    .mdt{font-size:17px;font-weight:800;margin-bottom:17px}
    .mf{margin-bottom:12px}
    .ml{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
    .mi{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:15px;outline:none;font-family:inherit;transition:border-color .15s}
    .mi:focus{border-color:var(--accent-l)}
    .ma{display:flex;gap:8px;margin-top:17px}
    .mb{flex:1;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s;font-family:inherit}
    .mb:active{opacity:.8}
    .mb.primary{background:var(--accent);color:#fff}
    .mb.danger{background:var(--red);color:#fff}
    .mb.cancel{background:var(--surface2);color:var(--text)}

    /* MISC */
    .empty{text-align:center;padding:44px 18px;color:var(--muted)}
    .empty-ico{font-size:44px;margin-bottom:10px}
    .empty-txt{font-size:16px;font-weight:700;color:var(--text)}
    .empty-sub{font-size:13px;margin-top:5px}
    .gap{height:16px}
    .spin{display:inline-block;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 17px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

    /* PROGRESS LIST */
    .phase-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border)}
    .phase-row:last-child{border-bottom:none}
    .phase-row.done{color:var(--text)}
    .phase-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
    .phase-dot.done{background:var(--accent)}
  </style>
</head>
<body>

<!-- ═══ MAIN APP ══════════════════════════════════════════════════════ -->
<div id="app">
  <div id="header"></div>
  <div id="content"></div>
  <nav id="nav">
    <button class="nb active" data-view="home"       onclick="sv('home')">      <span class="ni">🏠</span><span>Home</span></button>
    <button class="nb"        data-view="milestones" onclick="sv('milestones')"><span class="ni">📋</span><span>Goals</span></button>
    <button class="nb"        data-view="growth"     onclick="sv('growth')">    <span class="ni">📈</span><span>Growth</span></button>
    <button class="nb"        data-view="trends"     onclick="sv('trends')">    <span class="ni">📅</span><span>Trends</span></button>
    <button class="nb"        data-view="advisor"    onclick="sv('advisor')">   <span class="ni">💬</span><span>Advisor</span></button>
    <button class="nb"        data-view="settings"   onclick="sv('settings')">  <span class="ni">⚙️</span><span>Settings</span></button>
  </nav>
</div>

<div class="mo hidden" id="MO" onclick="handleOC(event)"><div class="md" id="MD"></div></div>
<div class="toast" id="T"></div>

<script>
// ═══ CONFIG ═══════════════════════════════════════════════════════════════
const MIO_DOB = '2024-10-15';
// Reusing the same Google Cloud project as Financial Tracker.
// ⚠️ Before going live: add the Mio Tracker GitHub Pages URL to Authorized JavaScript
// origins at console.cloud.google.com → APIs & Services → Credentials → OAuth client.
const GDRIVE_CLIENT_ID = '428293773028-hdmpetjd007bahi6kmm4ku61j8gss3mf.apps.googleusercontent.com';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const APP_VERSION = '1.0.0-phase2';

// CDC 18-month milestone checklist (all five domains)
const CDC_ITEMS = [
  { domain:'language',         item:'Says 3+ words besides mama/dada' },
  { domain:'language',         item:'Points to ask for something or get help' },
  { domain:'language',         item:'Follows 1-step direction without gesture' },
  { domain:'cognitive',        item:'Copies simple chores (sweeping, wiping)' },
  { domain:'cognitive',        item:'Plays with toys simply (pushes car, stacks blocks)' },
  { domain:'social_emotional', item:'Points to show you interesting things' },
  { domain:'social_emotional', item:'Shows affection (hugs, kisses)' },
  { domain:'social_emotional', item:'Explores but checks you are near' },
  { domain:'motor_gross',      item:'Walks well on own' },
  { domain:'motor_gross',      item:'Climbs on/off furniture' },
  { domain:'motor_fine',       item:'Scribbles with crayons' },
  { domain:'motor_fine',       item:'Stacks 2+ objects' },
  { domain:'adaptive',         item:'Feeds self with fingers or spoon' },
  { domain:'adaptive',         item:'Drinks from open cup' },
];

// ═══ DATA MODEL ════════════════════════════════════════════════════════════
const DEF = {
  version: 1,
  child: { name: 'Mio', dob: MIO_DOB, sex: 'M', languages: ['Filipino', 'English'], pediatrician: {} },
  growth: [],        // { id, date, ageMonths, weightKg, heightCm, headCm, note }
  milestones: [],    // { id, date, ageMonths, domain, item, status, note }
  wellbeing: [],     // { id, date, sleepBand, appetite, mood, activeBand, screenBand, readTogether, note }
  words: [],         // { id, word, meaning, language, firstHeard }
  safetyStatus: {},  // { itemKey: lastConfirmedDate }
  checkinLog: [],    // { date, answeredKeys[], skippedKeys[] }
  immunizations: [], // { id, vaccine, date, source, note }
  activities: [],    // { id, weekOf, day, activity, domain, targetWords[], done }
  settings: {
    driveFileId: null,
    theme: 'dark',
    checkinDoneDate: null,
    onboardingDone: false,
    proxyUrl: 'https://claude-proxy.raffy-tanpho.workers.dev'
  }
};

// ═══ STATE ═════════════════════════════════════════════════════════════════
let data = clone(DEF);
let view = 'home';
let onboardStep = 0;
let gdriveToken = null;
let gdriveFileId = null;
let gdriveRefreshTimer = null;
let _db = null;

// ═══ HELPERS ═══════════════════════════════════════════════════════════════
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function today() { return new Date().toISOString().slice(0, 10); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function ageMonths(dob) {
  const birth = new Date((dob || MIO_DOB) + 'T00:00:00');
  const now = new Date();
  let months = (now.getFullYear() - birth.getFullYear()) * 12 + (now.getMonth() - birth.getMonth());
  if (now.getDate() < birth.getDate()) months--;
  return Math.max(0, months);
}

function ageStr(dob) {
  const m = ageMonths(dob);
  const y = Math.floor(m / 12);
  const mo = m % 12;
  if (y === 0) return `${m} months old`;
  if (mo === 0) return `${y} year${y !== 1 ? 's' : ''} old`;
  return `${y}y ${mo}mo old`;
}

// ═══ INDEXEDDB ════════════════════════════════════════════════════════════
async function openDB() {
  if (_db) return _db;
  return new Promise((res, rej) => {
    const r = indexedDB.open('mioDB', 1);
    r.onupgradeneeded = e => { try { e.target.result.createObjectStore('kv'); } catch (x) {} };
    r.onsuccess = e => { _db = e.target.result; res(_db); };
    r.onerror = rej;
  });
}
async function dbGet(k) {
  await openDB();
  return new Promise((res, rej) => {
    const r = _db.transaction('kv', 'readonly').objectStore('kv').get(k);
    r.onsuccess = e => res(e.target.result);
    r.onerror = rej;
  });
}
async function dbSet(k, v) {
  await openDB();
  return new Promise((res, rej) => {
    const tx = _db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = res;
    tx.onerror = rej;
  });
}

// ═══ SAVE / LOAD ══════════════════════════════════════════════════════════
// Phase 1: local-only. Phase 6 will add merge-before-save Drive PATCH here.
async function save() {
  await dbSet('data', clone(data));
}

async function loadData() {
  const stored = await dbGet('data');
  if (stored) {
    data = { ...clone(DEF), ...stored };
    // Ensure all array/object fields exist (migration safety)
    ['growth','milestones','wellbeing','words','checkinLog','immunizations','activities'].forEach(k => {
      if (!Array.isArray(data[k])) data[k] = [];
    });
    if (!data.safetyStatus || typeof data.safetyStatus !== 'object') data.safetyStatus = {};
    if (!data.child || typeof data.child !== 'object') data.child = clone(DEF.child);
    if (!data.settings || typeof data.settings !== 'object') data.settings = clone(DEF.settings);
  }
}

// ═══ LAUNCH ════════════════════════════════════════════════════════════════
async function launchApp() {
  await loadData();
  await tryRestoreAuth();
  // Pre-seed Mio's known words/milestones before first onboarding
  if (!data.settings?.onboardingDone && (data.words||[]).length === 0) {
    seedKnownData();
    await save();
  }
  sv('home');
}

// ═══ DRIVE AUTH (connect only — sync in Phase 6) ═══════════════════════
function scheduleTokenRefresh(expiresInMs) {
  if (gdriveRefreshTimer) clearTimeout(gdriveRefreshTimer);
  const refreshIn = Math.max(expiresInMs - 5 * 60 * 1000, 30000);
  gdriveRefreshTimer = setTimeout(silentTokenRefresh, refreshIn);
}

function silentTokenRefresh() {
  if (!window.google?.accounts?.oauth2) return;
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID, scope: GDRIVE_SCOPE,
    callback: async r => {
      if (r.error || !r.access_token) return;
      gdriveToken = r.access_token;
      await dbSet('gdriveToken', r.access_token);
      const expiry = Date.now() + ((r.expires_in || 3599) * 1000);
      await dbSet('gdriveExpiry', expiry);
      scheduleTokenRefresh((r.expires_in || 3599) * 1000);
    }
  });
  client.requestAccessToken({ prompt: '' });
}

async function connectDrive() {
  if (!window.google?.accounts?.oauth2) { toast('Google sign-in not loaded yet — try refreshing.'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID, scope: GDRIVE_SCOPE,
    callback: async r => {
      if (r.error) { toast('Could not connect to Google Drive.'); return; }
      gdriveToken = r.access_token;
      await dbSet('gdriveToken', r.access_token);
      const expiry = Date.now() + ((r.expires_in || 3599) * 1000);
      await dbSet('gdriveExpiry', expiry);
      scheduleTokenRefresh((r.expires_in || 3599) * 1000);
      // Phase 6 will add findOrCreateDriveFile() and loadFromDrive() here.
      toast('✅ Google account connected! Drive sync activates in Phase 6.');
      updateHdr();
      if (view === 'settings') renderView();
    }
  });
  client.requestAccessToken({ prompt: '' });
}

async function disconnectDrive() {
  gdriveToken = null;
  gdriveFileId = null;
  if (gdriveRefreshTimer) clearTimeout(gdriveRefreshTimer);
  await dbSet('gdriveToken', null);
  await dbSet('gdriveExpiry', null);
  await dbSet('gdriveFileId', null);
  toast('Disconnected from Google Drive.');
  updateHdr();
  if (view === 'settings') renderView();
}

async function tryRestoreAuth() {
  try {
    const token = await dbGet('gdriveToken');
    const expiry = await dbGet('gdriveExpiry');
    if (!token || !expiry) return;
    if (Date.now() > expiry) { await dbSet('gdriveToken', null); return; }
    gdriveToken = token;
    gdriveFileId = await dbGet('gdriveFileId') || null;
    scheduleTokenRefresh(expiry - Date.now());
  } catch (e) {}
}

// ═══ EXPORT / IMPORT ══════════════════════════════════════════════════════
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mio-backup-${today()}.json`;
  a.click();
  toast('Backup exported!');
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const imp = JSON.parse(await file.text());
      // Light validation: must look like Mio Tracker data
      if (!imp.child && !imp.wellbeing && !imp.words) throw new Error('invalid');
      data = { ...clone(DEF), ...imp };
      await save();
      toast('✅ Data imported!');
      renderView(); updateHdr();
    } catch (err) {
      toast('Not a valid Mio Tracker backup file.');
    }
  };
  inp.click();
}

// ═══ TOAST ════════════════════════════════════════════════════════════════
let _toastTimer;
function toast(msg) {
  const t = document.getElementById('T');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ═══ MODAL ════════════════════════════════════════════════════════════════
function openModal(html, onClose) {
  document.getElementById('MD').innerHTML = html;
  document.getElementById('MO').classList.remove('hidden');
  document.getElementById('MO')._onClose = onClose || null;
}
function closeModal() {
  const mo = document.getElementById('MO');
  mo.classList.add('hidden');
  if (mo._onClose) { mo._onClose(); mo._onClose = null; }
}
function handleOC(e) { if (e.target.id === 'MO') closeModal(); }

// ═══ VIEW SYSTEM ══════════════════════════════════════════════════════════
function sv(v) {
  view = v;
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  renderView();
  updateHdr();
}

function renderView() {
  const c = document.getElementById('content');
  if (view === 'home')       c.innerHTML = buildHome();
  else if (view === 'milestones') c.innerHTML = buildMilestones();
  else if (view === 'growth')    c.innerHTML = buildGrowth();
  else if (view === 'trends')    c.innerHTML = buildTrends();
  else if (view === 'advisor')   c.innerHTML = buildAdvisor();
  else                           c.innerHTML = buildSettings();
}

// ═══ HEADER ═══════════════════════════════════════════════════════════════
function updateHdr() {
  const dob = data.child?.dob || MIO_DOB;
  const name = data.child?.name || 'Mio';
  const age = ageStr(dob);
  const mo = ageMonths(dob);

  const driveBanner = !gdriveToken
    ? `<div class="drive-banner">⚠️ Drive sync not connected — data saved locally only <button onclick="connectDrive()">Connect</button></div>`
    : `<div class="drive-banner ok">☁️ Google connected — Drive sync activates in Phase 6</div>`;

  document.getElementById('header').innerHTML = `
    ${driveBanner}
    <div style="display:flex;align-items:flex-end;justify-content:space-between">
      <div>
        <div class="hdr-lbl">Tracking</div>
        <div class="hdr-name">${esc(name)}</div>
        <div class="hdr-age">${age} · ${mo} months · DOB ${dob}</div>
      </div>
      <div style="text-align:right;padding-bottom:2px">
        <div class="hdr-lbl">Today</div>
        <div style="font-size:13px;color:var(--muted);font-weight:600;margin-top:2px">
          ${new Date().toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}
        </div>
      </div>
    </div>
  `;
}

// ═══ HOME VIEW ════════════════════════════════════════════════════════════
function buildHome() {
  if (!data.settings?.onboardingDone) return buildOnboarding();

  const dob = data.child?.dob || MIO_DOB;
  const mo = ageMonths(dob);
  const wordCount = (data.words || []).length;
  const checkinDone = data.settings?.checkinDoneDate === today();
  const lastGrowth = (data.growth || []).slice().sort((a,b) => b.date.localeCompare(a.date))[0];

  const phases = [
    { done: true,  label: 'Phase 1: Scaffold' },
    { done: true,  label: 'Phase 2: Onboarding + baseline data' },
    { done: false, label: 'Phase 3: Daily check-in engine' },
    { done: false, label: 'Phase 4: Milestones + Trends views' },
    { done: false, label: 'Phase 5: Growth + WHO percentile curves' },
    { done: false, label: 'Phase 6: Drive sync — two-device sharing' },
    { done: false, label: 'Phase 7: AI Advisor (KB-grounded chat)' },
    { done: false, label: 'Phase 8: Polish + wife onboarding' },
  ];

  return `
    <div style="padding:12px 13px 0">

      <div class="card" style="background:linear-gradient(135deg,#112a1a 0%,#0d1e12 100%);border-color:#2a5c38">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#7bc9a0;font-weight:700;margin-bottom:8px">Daily Check-In</div>

  return `

        ${i>0 ? `<div style="height:1px;width:18px;background:${i<=onboardStep?'var(--accent)':'var(--border)'}"></div>` : ''}

          <div style="width:9px;height:9px;border-radius:50%;background:${i<=onboardStep?'var(--accent)':'var(--border)'}"></div>
          ${i===onboardStep ? `<div style="font-size:9px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px;white-space:nowrap">${l}</div>` : ''}
        </div>
      `).join('')}
    </div>`;
}

function buildOnboarding() {
  if (onboardStep === 0) return buildObWelcome();
  if (onboardStep === 1) return buildObMeasurements();

}

function buildObMilestones() {
  const DLABELS = { language:'Language', cognitive:'Cognitive', social_emotional:'Social / Emotional', motor_gross:'Gross Motor', motor_fine:'Fine Motor', adaptive:'Self-Help' };
  const domains = ['language','cognitive','social_emotional','motor_gross','motor_fine','adaptive'];

  function statusOf(item) {
    return (data.milestones||[]).find(m => m.item === item)?.status || null;
  }
  function sBtn(item, status, label, color) {
    const on = statusOf(item) === status;
    return `<button onclick="setObMilestone('${item.replace(/'/g,'\\\'').replace(/"/g,'&quot;')}','${status}')"
      style="flex:1;padding:7px 2px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;
        border:1.5px solid ${on?color:'var(--border)'};background:${on?color+'22':'var(--surface2)'};color:${on?color:'var(--muted)'}">${label}</button>`;
  }

  return `
    <div style="padding:16px 13px">
      ${obProgress()}
      <div class="card">
        <div class="card-title">Milestone Snapshot (CDC 18-month)</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:14px">One tap per item. Skip anything you're unsure of — the daily check-in will fill these in over time.</div>
        ${domains.map(domain => {
          const items = CDC_ITEMS.filter(x => x.domain === domain);
          if (!items.length) return '';
          return `<div style="margin-bottom:14px">
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--accent-l);font-weight:700;margin-bottom:8px">${DLABELS[domain]}</div>
            ${items.map(ci => `
              <div style="margin-bottom:10px">
                <div style="font-size:13px;font-weight:600;margin-bottom:6px">${esc(ci.item)}</div>
                <div style="display:flex;gap:5px">
                  ${sBtn(ci.item,'reached','✓ Yes','var(--green)')}
                  ${sBtn(ci.item,'attempting','~ Working','var(--yellow)')}
                  ${sBtn(ci.item,'not-yet','✗ Not yet','var(--muted)')}
                </div>
              </div>`).join('')}
          </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:8px;padding:0 0 10px">

        <button onclick="finishOnboard()" class="mb primary">Finish ✓</button>
      </div>
    </div><div class="gap"></div>`;
}

function buildObFinish() {

// ── ONBOARD ACTIONS ──────────────────────────────────────────────────
function nextOnboard() { onboardStep = Math.min(onboardStep+1, 4); renderView(); }
function prevOnboard() { onboardStep = Math.max(onboardStep-1, 0); renderView(); }

async function skipOnboard() {
  if (!data.settings) data.settings = {};
  data.settings.onboardingDone = true;
  await save(); renderView(); updateHdr();
}

function addObWord() {
  const word = (document.getElementById('obWord')?.value||'').trim();
  if (!word) return;
  const meaning  = (document.getElementById('obMeaning')?.value||'').trim();
  const language = document.getElementById('obLang')?.value || 'Filipino';
  if (!data.words) data.words = [];
  if (data.words.some(w => w.word.toLowerCase()===word.toLowerCase())) { toast('Already in the list.'); return; }
  data.words.push({ id:uid(), word, meaning, language, firstHeard:today() });
  renderView();
}

function removeWord(wordId) {
  data.words = (data.words||[]).filter(w => w.id !== wordId);
  renderView();
}

function setObMilestone(item, status) {
  if (!data.milestones) data.milestones = [];
  const existing = data.milestones.find(m => m.item === item);
  if (existing) {
    existing.status = status; existing.date = today();
  } else {
    const ci = CDC_ITEMS.find(x => x.item === item);
    data.milestones.push({ id:uid(), date:today(), ageMonths:ageMonths(data.child?.dob||MIO_DOB), domain:ci?.domain||'other', item, status, note:'' });
  }
  renderView();
}

async function saveObMeasurements() {
  const dateVal = document.getElementById('obDate')?.value || today();
  const wt = parseFloat(document.getElementById('obWt')?.value);
  const ht = parseFloat(document.getElementById('obHt')?.value);
  const hd = parseFloat(document.getElementById('obHd')?.value);
  if (wt || ht || hd) {
    if (!data.growth) data.growth = [];
    data.growth = data.growth.filter(g => g.note !== 'Onboarding entry');
    data.growth.push({ id:uid(), date:dateVal, ageMonths:ageMonths(data.child?.dob||MIO_DOB), weightKg:wt||null, heightCm:ht||null, headCm:hd||null, note:'Onboarding entry' });
  }
  nextOnboard();
}

async function finishOnboard() {
  onboardStep = 4;
  await save(); renderView();
}

async function completeOnboard() {
  if (!data.settings) data.settings = {};
  data.settings.onboardingDone = true;
  await save();
  onboardStep = 0;
  renderView(); updateHdr();
  toast('✅ Setup complete!');
}

function importOnboardData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const imp = JSON.parse(await file.text());
      if (!imp.child && !imp.words && !imp.growth) throw new Error('invalid');
      data = { ...clone(DEF), ...imp };
      data.settings = { ...clone(DEF.settings), ...(imp.settings||{}), onboardingDone:true };
      await save(); toast('✅ Imported!'); onboardStep=0; renderView(); updateHdr();
    } catch(err) { toast('Not a valid Mio Tracker file.'); }
  };
  inp.click();
}

(async function init() {
  await openDB();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW registration failed:', e));
  }
  await launchApp();
})();
</script>
