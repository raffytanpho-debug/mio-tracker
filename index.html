<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex,nofollow">
  <title>Mio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#161b22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mio">
  <link rel="apple-touch-icon" href="apple-touch-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Ember Night — warm dark (default) */
      --bg:#171412; --surface:#221E1B; --surface2:#2C2723; --border:#38322C;
      --text:#F4EFE8; --muted:#C0B7AC;
      --accent:#C58A5C; --accent-l:#D8A475; --on-accent:#1B1511;
      --green:#8AA195; --red:#E0857A; --yellow:#E0B257; --blue:#8FB0C9; --purple:#B891B2;
      --warn-bg:rgba(216,164,117,.14); --warn-bd:rgba(216,164,117,.32); --warn-tx:#E8CBA6;
      --ok-bg:rgba(138,161,149,.15); --ok-bd:rgba(138,161,149,.34); --ok-tx:#AAC3B5;
      --serif:'Newsreader',Georgia,'Times New Roman',serif;
      --nav-h:60px; --r:16px; --rs:12px;
    }
    /* Linen & Clay — warm light (system default unless overridden) */
    @media (prefers-color-scheme: light){
      :root:not([data-theme]){
        --bg:#FAF5EF; --surface:#FFFDFC; --surface2:#F2ECE4; --border:#E6DED3;
        --text:#231F1B; --muted:#6E655B;
        --accent:#975435; --accent-l:#7E4429; --on-accent:#FFFFFF;
        --green:#5C6F67; --red:#A8443A; --yellow:#8A5E16; --blue:#4E6B86; --purple:#7A5570;
        --warn-bg:rgba(154,107,30,.12); --warn-bd:rgba(154,107,30,.30); --warn-tx:#7A4F12;
        --ok-bg:rgba(92,111,103,.13); --ok-bd:rgba(92,111,103,.32); --ok-tx:#3E4F47;
      }
    }
    :root[data-theme="light"]{
      --bg:#FAF5EF; --surface:#FFFDFC; --surface2:#F2ECE4; --border:#E6DED3;
      --text:#231F1B; --muted:#6E655B;
      --accent:#975435; --accent-l:#7E4429; --on-accent:#FFFFFF;
      --green:#5C6F67; --red:#A8443A; --yellow:#8A5E16; --blue:#4E6B86; --purple:#7A5570;
      --warn-bg:rgba(154,107,30,.12); --warn-bd:rgba(154,107,30,.30); --warn-tx:#7A4F12;
      --ok-bg:rgba(92,111,103,.13); --ok-bd:rgba(92,111,103,.32); --ok-tx:#3E4F47;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}

    /* APP */
    #app{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}
    #header{background:var(--bg);padding:14px 16px 16px;flex-shrink:0;border-bottom:1px solid var(--border)}
    #content{flex:1;overflow-y:auto;padding-bottom:var(--nav-h)}
    #nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100}

    /* HEADER */
    .drive-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:10px;padding:8px 11px;margin-bottom:12px;font-size:12px;color:var(--warn-tx)}
    .drive-banner.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-tx)}
    .drive-banner button{background:var(--warn-bd);border:none;border-radius:7px;color:var(--warn-tx);font-size:11px;font-weight:600;padding:4px 9px;cursor:pointer}
    .hdr-lbl{font-size:12px;color:var(--muted);letter-spacing:.2px;font-weight:600}
    .hdr-name{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:0;color:var(--text);margin:3px 0 4px}
    .hdr-age{font-size:13px;color:var(--accent-l);font-weight:600}

    /* NAV */
    .nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--muted);border:none;background:none;font-size:10px;font-weight:600;letter-spacing:.2px;transition:color .2s;padding:0}
    .nb.active{color:var(--accent-l)}
    .ni{font-size:18px;line-height:1}

    /* CARDS */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin:0 13px 10px}
    .card-title{font-size:12px;letter-spacing:.2px;color:var(--muted);margin-bottom:11px;font-weight:600}

    /* STATS PAIR */
    .scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px}
    .s-lbl{font-size:11px;letter-spacing:.2px;color:var(--muted);font-weight:600}
    .s-val{font-size:21px;font-weight:800;margin:3px 0 2px;letter-spacing:-.5px}
    .s-sub{font-size:11px;color:var(--muted)}

    /* SETTINGS */
    .set-sec{padding:14px 13px 6px;font-size:12px;letter-spacing:.2px;color:var(--muted);font-weight:600}
    .set-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:12px 13px;margin:0 13px 7px;display:flex;align-items:center;justify-content:space-between;gap:11px}
    .set-lbl{font-size:14px;font-weight:600}
    .set-sub{font-size:11px;color:var(--muted);margin-top:2px}
    .set-inp{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;color:var(--text);font-size:13px;outline:none;width:100%;font-family:inherit;transition:border-color .2s}
    .set-inp:focus{border-color:var(--accent-l)}
    .set-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
    .set-btn:hover{border-color:var(--accent-l);color:var(--accent-l)}
    .set-btn.ok{border-color:var(--green);color:var(--green)}
    .set-btn.danger{border-color:var(--red);color:var(--red)}

    /* MODAL */
    .mo{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
    .mo.hidden{display:none}
    .md{background:var(--surface);border-radius:22px 22px 0 0;padding:0 17px 30px;width:100%;max-width:430px;border-top:1px solid var(--border);max-height:90vh;overflow-y:auto}
    .mdh{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 17px}
    .mdt{font-size:17px;font-weight:800;margin-bottom:17px}
    .mf{margin-bottom:12px}
    .ml{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px;margin-bottom:5px}
    .mi{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:15px;outline:none;font-family:inherit;transition:border-color .15s}
    .mi:focus{border-color:var(--accent-l)}
    .ma{display:flex;gap:8px;margin-top:17px}
    .mb{flex:1;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;border:none;transition:opacity .15s;font-family:inherit}
    .mb:active{opacity:.8}
    .mb.primary{background:var(--accent);color:var(--on-accent)}
    .mb.danger{background:var(--red);color:#fff}
    .mb.cancel{background:var(--surface2);color:var(--text)}

    /* MISC */
    .empty{text-align:center;padding:44px 18px;color:var(--muted)}
    .empty-ico{font-size:44px;margin-bottom:10px}
    .empty-txt{font-size:16px;font-weight:700;color:var(--text)}
    .empty-sub{font-size:13px;margin-top:5px}
    .gap{height:16px}
    .spin{display:inline-block;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 17px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    @keyframes adot{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

    /* PROGRESS LIST */
    .phase-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--muted);border-bottom:1px solid var(--border)}
    .phase-row:last-child{border-bottom:none}
    .phase-row.done{color:var(--text)}
    .phase-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
    .phase-dot.done{background:var(--accent)}
  </style>
</head>

// ═══ HELPERS ═══════════════════════════════════════════════════════════════
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function today() { return new Date().toISOString().slice(0, 10); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function ageMonths(dob) {
  const birth = new Date((dob || MIO_DOB) + 'T00:00:00');
  const now = new Date();
  let months = (now.getFullYear() - birth.getFullYear()) * 12 + (now.getMonth() - birth.getMonth());
  if (now.getDate() < birth.getDate()) months--;
  return Math.max(0, months);
}

function ageStr(dob) {
  const m = ageMonths(dob);
  const y = Math.floor(m / 12);
  const mo = m % 12;
  if (y === 0) return `${m} months old`;
  if (mo === 0) return `${y} year${y !== 1 ? 's' : ''} old`;
  return `${y}y ${mo}mo old`;
}

function ageMonthsAt(dob, atDate) {
  const birth = new Date((dob || MIO_DOB) + 'T00:00:00');
  const at    = new Date((atDate || today()) + 'T00:00:00');
  let months = (at.getFullYear() - birth.getFullYear()) * 12 + (at.getMonth() - birth.getMonth());
  if (at.getDate() < birth.getDate()) months--;
  return Math.max(0, months);
}

// ─── General helpers ─────────────────────────────────────────────────────────
function sevenDaysAgo() {
  const d = new Date(); d.setDate(d.getDate() - 7);
  return d.toISOString().slice(0, 10);
}

function summarizeBands(rows, field, labels) {
  const counts = {};
  for (const r of rows) {
    const v = r[field];
    if (v != null) { const k = labels[v] || v; counts[k] = (counts[k]||0)+1; }
  }
  const entries = Object.entries(counts);
  if (!entries.length) return 'not logged';
  return entries.map(([k,c]) => `${k}×${c}`).join(', ');
}

function renderMD(text) {
  // Minimal safe markdown: escape HTML first, then apply bold/italic/newlines
  return String(text||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n\n+/g,'<br><br>')
    .replace(/\n/g,'<br>');
}

// ─── WHO growth helpers ───────────────────────────────────────────────────────
function whoInterp(month, table) {
  const months = Object.keys(table).map(Number).sort((a,b)=>a-b);
  const mn = months[0], mx = months[months.length-1];
  if (month <= mn) return table[mn];
  if (month >= mx) return table[mx];
  let lo = mn, hi = mx;
  for (let i = 0; i < months.length-1; i++) {
    if (months[i] <= month && months[i+1] >= month) { lo = months[i]; hi = months[i+1]; break; }
  }
  const t = (month - lo) / (hi - lo);
  return table[lo].map((v, i) => +(v + t * (table[hi][i] - v)).toFixed(3));
}

function getBandIdx(month, value, table) {
  const row = whoInterp(month, table);
  if (!row) return null;
  if (value < row[0]) return 0;
  for (let i = 0; i < 6; i++) { if (value < row[i+1]) return i+1; }
  return 7;
}

function getBandInfo(month, value, table) {
  const idx = getBandIdx(month, value, table);
  if (idx === null) return null;
  return { band: BAND_NAMES[idx], color: BAND_COLORS[idx], idx };
}

function checkBandCrossing(growthData, field, table) {
  const entries = (growthData||[]).filter(g => g[field] != null && g.ageMonths != null)
    .sort((a,b) => a.date.localeCompare(b.date));
  if (entries.length < 2) return null;
  const last2 = entries.slice(-2);
  const b1 = getBandIdx(last2[0].ageMonths, last2[0][field], table);
  const b2 = getBandIdx(last2[1].ageMonths, last2[1][field], table);
  if (b1 === null || b2 === null) return null;
  if (Math.abs(b2 - b1) >= 2) return { from: BAND_NAMES[b1], to: BAND_NAMES[b2] };
  return null;
}

function buildWhoChart(growthEntries, field, table, unit) {
  const W = 360, H = 160, ML = 36, MR = 28, MT = 6, MB = 22;
  const CW = W - ML - MR, CH = H - MT - MB;

  const pts = (growthEntries||[])
    .filter(g => g[field] != null && g.ageMonths != null)
    .sort((a,b) => a.date.localeCompare(b.date))
    .map(g => ({ m: g.ageMonths, v: g[field] }));

  const curAge  = ageMonths(data.child?.dob || MIO_DOB);
  const tMonths = Object.keys(table).map(Number).sort((a,b)=>a-b);
  const maxM    = Math.min(30, Math.max(tMonths[tMonths.length-1], curAge + 2));

  const allV = tMonths.map(m=>table[m]).flat();
  const yRMin = Math.min(...allV), yRMax = Math.max(...allV);
  const yPad  = (yRMax - yRMin) * 0.06;
  const yMin  = yRMin - yPad, yMax = yRMax + yPad;

  const xp = m   => ML + (m / maxM) * CW;
  const yp = val => MT + CH * (1 - (val - yMin) / (yMax - yMin));

  // P25–P75 band (normal range)
  const mF = tMonths.filter(m => m <= maxM);
  const polyN = [
    ...mF.map(m => `${xp(m).toFixed(1)},${yp(table[m][4]).toFixed(1)}`),
    ...[...mF].reverse().map(m => `${xp(m).toFixed(1)},${yp(table[m][2]).toFixed(1)}`)
  ].join(' ');
  // P3–P97 outer band
  const polyO = [
    ...mF.map(m => `${xp(m).toFixed(1)},${yp(table[m][6]).toFixed(1)}`),
    ...[...mF].reverse().map(m => `${xp(m).toFixed(1)},${yp(table[m][0]).toFixed(1)}`)
  ].join(' ');

  const bands = `
    <polygon points="${polyO}" fill="rgba(192,183,172,.07)" />
    <polygon points="${polyN}" fill="rgba(138,161,149,.16)" />`;

  // Percentile reference lines — warm, neutral tones (no alarm red/yellow)
  const PLINES = [
    {i:0,c:'rgba(168,158,145,.5)', da:'4,3', lb:'P3' },
    {i:1,c:'rgba(168,158,145,.35)',da:'3,3', lb:''   },
    {i:3,c:'rgba(168,158,145,.7)', da:'',    lb:'P50'},
    {i:5,c:'rgba(168,158,145,.35)',da:'3,3', lb:''   },
    {i:6,c:'rgba(168,158,145,.5)', da:'4,3', lb:'P97'},
  ];
  let pLines = '';
  for (const p of PLINES) {
    const d = mF.map((m,k) => `${k===0?'M':'L'}${xp(m).toFixed(1)},${yp(table[m][p.i]).toFixed(1)}`).join(' ');
    pLines += `<path d="${d}" fill="none" stroke="${p.c}" stroke-width="1" ${p.da?`stroke-dasharray="${p.da}"`:''} />`;
    if (p.lb) {
      const lm = mF[mF.length-1];
      pLines += `<text x="${(xp(lm)+3).toFixed(1)}" y="${(yp(table[lm][p.i])+3).toFixed(1)}" font-size="7.5" fill="${p.c.replace(/[\d.]+\)$/,'0.9)')}">${p.lb}</text>`;
    }
  }

  // Mio's data
  let mioLine = '';
  if (pts.length >= 2) {
    const pd = pts.map((p,i) => `${i===0?'M':'L'}${xp(p.m).toFixed(1)},${yp(p.v).toFixed(1)}`).join(' ');
    mioLine = `<path d="${pd}" fill="none" stroke="#C58A5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />`;
  }
  const mioDots = pts.map(p =>
    `<circle cx="${xp(p.m).toFixed(1)}" cy="${yp(p.v).toFixed(1)}" r="4" fill="#C58A5C" stroke="#8A5A38" stroke-width="1.5" />`
  ).join('');

  // Axes + labels
  const xStep = maxM <= 18 ? 3 : 6;
  let xTicks = '';
  for (let m = 0; m <= maxM; m += xStep) {
    const x = xp(m).toFixed(1);
    xTicks += `<line x1="${x}" y1="${MT+CH}" x2="${x}" y2="${MT+CH+3}" stroke="rgba(168,158,145,.45)" stroke-width="1"/>
      <text x="${x}" y="${MT+CH+13}" font-size="8" fill="rgba(168,158,145,.85)" text-anchor="middle">${m}</text>`;
  }
  let yLabels = '';
  for (let i = 0; i <= 4; i++) {
    const val = yMin + (yMax - yMin) * (i / 4);
    const y   = yp(val).toFixed(1);
    yLabels += `<line x1="${ML-2}" y1="${y}" x2="${ML}" y2="${y}" stroke="rgba(168,158,145,.45)" stroke-width="1"/>
      <text x="${ML-4}" y="${(+y+3).toFixed(1)}" font-size="8" fill="rgba(168,158,145,.85)" text-anchor="end">${val.toFixed(1)}</text>`;
  }
  const axes = `
    <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${MT+CH}" stroke="rgba(168,158,145,.45)" stroke-width="1"/>
    <line x1="${ML}" y1="${MT+CH}" x2="${ML+CW}" y2="${MT+CH}" stroke="rgba(168,158,145,.45)" stroke-width="1"/>
    <text x="${(ML+CW/2).toFixed(1)}" y="${H-3}" font-size="8" fill="rgba(168,158,145,.7)" text-anchor="middle">age (months)</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;overflow:visible">
    ${axes}${xTicks}${yLabels}${bands}${pLines}${mioLine}${mioDots}
  </svg>`;
}

// ═══ INDEXEDDB ════════════════════════════════════════════════════════════
async function openDB() {
  if (_db) return _db;
  return new Promise((res, rej) => {
    const r = indexedDB.open('mioDB', 1);
    r.onupgradeneeded = e => { try { e.target.result.createObjectStore('kv'); } catch (x) {} };
    r.onsuccess = e => { _db = e.target.result; res(_db); };
    r.onerror = rej;
  });
}
async function dbGet(k) {
  await openDB();
  return new Promise((res, rej) => {
    const r = _db.transaction('kv', 'readonly').objectStore('kv').get(k);
    r.onsuccess = e => res(e.target.result);
    r.onerror = rej;
  });
}
async function dbSet(k, v) {
  await openDB();
  return new Promise((res, rej) => {
    const tx = _db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = res;
    tx.onerror = rej;
  });
}

// ═══ DRIVE AUTH (server-side auth-code flow via Cloudflare Worker) ══════════
// The Worker holds the long-lived refresh token; the client holds only an opaque
// session_id and asks the Worker for a fresh access token whenever it needs one.
// This is durable on desktop and on the installed iOS PWA (no reliance on a
// browser-held Google session). See GOOGLE_DRIVE_AUTH_PLAYBOOK.md.

function scheduleTokenRefresh(expiresInMs) {
  if (gdriveRefreshTimer) clearTimeout(gdriveRefreshTimer);
  const refreshIn = Math.max(expiresInMs - 5 * 60 * 1000, 30000);
  gdriveRefreshTimer = setTimeout(() => { getDriveToken(); }, refreshIn);
}

// Mint a fresh Drive access token from the stored session. Returns true on success.
async function getDriveToken() {
  if (!gdriveSession) gdriveSession = await dbGet('driveSession');
  if (!gdriveSession) return false;
  try {
    const r = await fetch(WORKER_BASE + '/drive/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: gdriveSession })
    });
    if (!r.ok) {
      // 401 = session is definitively dead; clear it so the reconnect banner shows.
      // Any other status is treated as transient — keep the session and retry later.
      if (r.status === 401) { gdriveSession = null; gdriveToken = null; await dbSet('driveSession', null); }
      return false;
    }
    const j = await r.json();
    if (!j.access_token) return false;
    gdriveToken = j.access_token;
    const ms = (j.expires_in || 3599) * 1000;
    await dbSet('gdriveExpiry', Date.now() + ms);
    scheduleTokenRefresh(ms);
    return true;
  } catch (e) { return false; }
}

// Refresh on refocus / reconnect if the token is missing or near expiry.
async function maybeRefreshToken() {
  if (!gdriveSession && !(gdriveSession = await dbGet('driveSession'))) return;
  const expiry = await dbGet('gdriveExpiry');
  if (!gdriveToken || !expiry || Date.now() > expiry - 60000) {
    const ok = await getDriveToken();
    if (ok) await syncFromDrive();
  }
}

// Start the consent flow. Full redirect (not a popup) so it works in the PWA.
// ?app=mio tells the shared Worker to return the browser to Mio, not Finance Tracker.
function connectDrive() {
  toast('Redirecting to Google…');
  location.href = WORKER_BASE + '/drive/start?app=mio';
}

// iOS fallback: the redirect can land in Safari instead of the installed PWA,
// so the connect page also prints a setup code that can be pasted here.
async function enterDriveCode() {
  const c = (prompt('Paste the setup code shown on the connect page:') || '').trim();
  if (!c) return;
  gdriveSession = c;
  await dbSet('driveSession', c);
  const ok = await getDriveToken();
  if (ok) {
    if (!gdriveFileId) await findOrCreateDriveFile();
    await syncFromDrive();
    toast('✅ Connected to Google Drive!');
  } else {
    toast('That code did not work — tap Connect to try again.');
  }
  updateHdr();
  if (view === 'settings') renderView();
}

async function disconnectDrive() {
  gdriveToken = null;
  gdriveFileId = null;
  gdriveSession = null;
  if (gdriveRefreshTimer) clearTimeout(gdriveRefreshTimer);
  await dbSet('driveSession', null);
  await dbSet('gdriveToken', null);
  await dbSet('gdriveExpiry', null);
  await dbSet('gdriveFileId', null);
  toast('Disconnected from Google Drive.');
  updateHdr();
  if (view === 'settings') renderView();
}

// On load: capture #drive_session from the hash (fresh connect) or restore the
// saved session, then mint a token and sync. Awaited before the first render.
async function tryRestoreFolder() {
  try {
    const m = location.hash.match(/drive_session=([^&]+)/);
    let fresh = false;
    if (m) {
      gdriveSession = decodeURIComponent(m[1]);
      await dbSet('driveSession', gdriveSession);
      history.replaceState(null, '', location.pathname + location.search);
      fresh = true;
    }
    gdriveSession = gdriveSession || await dbGet('driveSession');
    gdriveFileId = await dbGet('gdriveFileId') || null;
    if (!gdriveSession) return;
    const ok = await getDriveToken();
    if (ok) {
      if (!gdriveFileId) await findOrCreateDriveFile();
      await syncFromDrive();
      if (fresh) {
        toast('✅ Connected — data synced!');
        updateHdr();
        if (view === 'settings') renderView();
      }
    }
  } catch (e) {}
}

// ─── Merge helpers ──────────────────────────────────────────────────────────
function _mergeById(local, remote) {
  // Union by id. For same id, take the item with the later date.
  const map = new Map();
  for (const item of (remote||[])) map.set(item.id, item);
  for (const item of (local||[])) {
    if (!map.has(item.id)) { map.set(item.id, item); continue; }
    const existing = map.get(item.id);
    if ((item.date||'') >= (existing.date||'')) map.set(item.id, item);
  }
  return [...map.values()];
}

function _mergeWellbeing(local, remote) {
  // One row per date. For same date, union non-null fields (local wins on conflict).
  const byDate = new Map();
  for (const wb of (remote||[])) byDate.set(wb.date, {...wb});
  for (const wb of (local||[])) {
    if (!byDate.has(wb.date)) { byDate.set(wb.date, {...wb}); continue; }
    const merged = {...byDate.get(wb.date)};
    for (const [k,v] of Object.entries(wb)) { if (v != null) merged[k] = v; }
    byDate.set(wb.date, merged);
  }
  return [...byDate.values()].sort((a,b) => a.date.localeCompare(b.date));
}

function _mergeCheckinLog(local, remote) {
  // One row per date. Union answeredKeys and skippedKeys.
  const byDate = new Map();
  for (const log of (remote||[])) byDate.set(log.date, { ...log, answeredKeys:[...(log.answeredKeys||[])], skippedKeys:[...(log.skippedKeys||[])] });
  for (const log of (local||[])) {
    if (!byDate.has(log.date)) { byDate.set(log.date, {...log}); continue; }
    const ex = byDate.get(log.date);
    byDate.set(log.date, { ...ex,
      answeredKeys: [...new Set([...ex.answeredKeys||[], ...log.answeredKeys||[]])],
      skippedKeys:  [...new Set([...ex.skippedKeys||[],  ...log.skippedKeys||[]])],
    });
  }
  return [...byDate.values()].sort((a,b) => a.date.localeCompare(b.date));
}

function mergeData(local, remote) {
  if (!remote) return local;
  if (!local)  return remote;
  // Child: prefer local non-null fields
  const child = { ...remote.child, ...local.child };
  // Settings: merge; take later checkinDoneDate
  const ls = local.settings  || {}, rs = remote.settings || {};
  const settings = { ...clone(DEF.settings), ...rs, ...ls,
    checkinDoneDate: (ls.checkinDoneDate||'') >= (rs.checkinDoneDate||'') ? (ls.checkinDoneDate||null) : (rs.checkinDoneDate||null)
  };
  // safetyStatus: take later date per key
  const safetyStatus = { ...(remote.safetyStatus||{}) };
  for (const [k,v] of Object.entries(local.safetyStatus||{})) {
    if (!safetyStatus[k] || v > safetyStatus[k]) safetyStatus[k] = v;
  }
  // Tombstones: union of ids the user deleted on either side. Anything tombstoned
  // is dropped from the id-keyed collections so a delete is never resurrected.
  const deleted = new Set([...(local.deletedIds||[]), ...(remote.deletedIds||[])]);
  const dropDeleted = arr => (arr||[]).filter(x => !deleted.has(x.id));
  return {
    version: Math.max(local.version||1, remote.version||1),
    child,
    settings,
    safetyStatus,
    growth:       dropDeleted(_mergeById(local.growth,       remote.growth)),
    milestones:   dropDeleted(_mergeById(local.milestones,   remote.milestones)),
    words:        dropDeleted(_mergeById(local.words,         remote.words)),
    immunizations:dropDeleted(_mergeById(local.immunizations, remote.immunizations)),
    activities:   dropDeleted(_mergeById(local.activities,    remote.activities)),
    wellbeing:    _mergeWellbeing(local.wellbeing,   remote.wellbeing),
    checkinLog:   _mergeCheckinLog(local.checkinLog, remote.checkinLog),
    deletedIds:   [...deleted],
  };
}

// ─── Drive API ───────────────────────────────────────────────────────────────
async function findOrCreateDriveFile() {
  if (!gdriveToken) return null;
  try {
    const q  = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const sr = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`,
      { headers: { Authorization: `Bearer ${gdriveToken}` } }
    );
    if (!sr.ok) return null;
    const { files } = await sr.json();
    if (files && files.length > 0) {
      gdriveFileId = files[0].id;
      await dbSet('gdriveFileId', gdriveFileId);
      return gdriveFileId;
    }
    // Create new file with current data
    const boundary = 'mio_mp_boundary';
    const meta     = JSON.stringify({ name: DRIVE_FILE_NAME, mimeType: 'application/json' });
    const content  = JSON.stringify(clone(data));
    const body     = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
    const cr = await fetch(
      `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id`,
      { method:'POST', headers:{ Authorization:`Bearer ${gdriveToken}`, 'Content-Type':`multipart/related; boundary=${boundary}` }, body }
    );
    if (!cr.ok) return null;
    const { id } = await cr.json();
    gdriveFileId = id;
    await dbSet('gdriveFileId', id);
    return id;
  } catch(e) { console.warn('findOrCreateDriveFile:', e); return null; }
}

async function syncFromDrive() {
  // Download and merge — no upload. Used on app open.
  if (!gdriveToken || !gdriveFileId) return;
  try {
    const res = await fetch(
      `https://www.googleapis.com/drive/v3/files/${gdriveFileId}?alt=media`,
      { headers: { Authorization: `Bearer ${gdriveToken}` } }
    );
    if (!res.ok) return;
    const remote = await res.json();
    const before = JSON.stringify(data);
    data = mergeData(data, remote);
    await dbSet('data', clone(data));
    if (JSON.stringify(data) !== before) renderView();
  } catch(e) { console.warn('syncFromDrive:', e); }
}

async function _saveToDriveAsync() {
  // Merge-before-save: download latest, merge, upload. Non-blocking.
  if (_driveSync || !gdriveToken || !gdriveFileId) return;
  _driveSync = true;
  try {
    // 1. Download latest Drive version
    const dlRes = await fetch(
      `https://www.googleapis.com/drive/v3/files/${gdriveFileId}?alt=media`,
      { headers: { Authorization: `Bearer ${gdriveToken}` } }
    );
    if (dlRes.ok) {
      const remote = await dlRes.json();
      const before = JSON.stringify(data);
      data = mergeData(data, remote);
      if (JSON.stringify(data) !== before) {
        await dbSet('data', clone(data));
        renderView();
      }
    }
    // 2. Upload merged data
    const ulRes = await fetch(
      `https://www.googleapis.com/upload/drive/v3/files/${gdriveFileId}?uploadType=media`,
      { method:'PATCH', headers:{ Authorization:`Bearer ${gdriveToken}`, 'Content-Type':'application/json' }, body: JSON.stringify(data) }
    );
    _driveSyncFailed = !ulRes.ok;
    if (!ulRes.ok) console.warn('Drive upload failed:', ulRes.status);
  } catch(e) {
    _driveSyncFailed = true;
    console.warn('Drive sync error:', e);
  } finally {
    _driveSync = false;
    updateHdr();
  }
}

function exportData() {

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mio-backup-${today()}.json`;
  a.click();
  toast('Backup exported!');
}

function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const imp = JSON.parse(await file.text());
      // Light validation: must look like Mio Tracker data
      if (!imp.child && !imp.wellbeing && !imp.words) throw new Error('invalid');
      data = { ...clone(DEF), ...imp };
      await save();
      toast('✅ Data imported!');
      renderView(); updateHdr();
    } catch (err) {
      toast('Not a valid Mio Tracker backup file.');
    }
  };
  inp.click();
}

// ── ONBOARD ACTIONS ──────────────────────────────────────────────────
function nextOnboard() { onboardStep = Math.min(onboardStep+1, 4); renderView(); }
function prevOnboard() { onboardStep = Math.max(onboardStep-1, 0); renderView(); }

async function skipOnboard() {
  if (!data.settings) data.settings = {};
  data.settings.onboardingDone = true;
  await save(); renderView(); updateHdr();
}

function addObWord() {
  const word = (document.getElementById('obWord')?.value||'').trim();
  if (!word) return;
  const meaning  = (document.getElementById('obMeaning')?.value||'').trim();
  const language = document.getElementById('obLang')?.value || 'Filipino';
  if (!data.words) data.words = [];
  if (data.words.some(w => w.word.toLowerCase()===word.toLowerCase())) { toast('Already in the list.'); return; }
  data.words.push({ id:uid(), word, meaning, language, firstHeard:today(), category:'other', clarity:null });
  renderView();
}

function removeWord(wordId) {
  data.words = (data.words||[]).filter(w => w.id !== wordId);
  tombstone(wordId);
  renderView();
}

function setObMilestone(item, status) {
  if (!data.milestones) data.milestones = [];
  const existing = data.milestones.find(m => m.item === item);
  if (existing) {
    existing.status = status; existing.date = today();
  } else {
    const ci = CDC_ITEMS.find(x => x.item === item);
    data.milestones.push({ id:uid(), date:today(), ageMonths:ageMonths(data.child?.dob||MIO_DOB), domain:ci?.domain||'other', item, status, note:'' });
  }
  renderView();
}

async function saveObMeasurements() {
  const dateVal = document.getElementById('obDate')?.value || today();
  const wt = parseFloat(document.getElementById('obWt')?.value);
  const ht = parseFloat(document.getElementById('obHt')?.value);
  const hd = parseFloat(document.getElementById('obHd')?.value);
  if (wt || ht || hd) {
    if (!data.growth) data.growth = [];
    data.growth = data.growth.filter(g => g.note !== 'Onboarding entry');
    data.growth.push({ id:uid(), date:dateVal, ageMonths:ageMonths(data.child?.dob||MIO_DOB), weightKg:wt||null, heightCm:ht||null, headCm:hd||null, note:'Onboarding entry' });
  }
  nextOnboard();
}

async function finishOnboard() {
  onboardStep = 4;
  await save(); renderView();
}

async function completeOnboard() {
  if (!data.settings) data.settings = {};
  data.settings.onboardingDone = true;
  await save();
  onboardStep = 0;
  renderView(); updateHdr();
  toast('✅ Setup complete!');
}

function importOnboardData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const imp = JSON.parse(await file.text());
      if (!imp.child && !imp.words && !imp.growth) throw new Error('invalid');
      data = { ...clone(DEF), ...imp };
      data.settings = { ...clone(DEF.settings), ...(imp.settings||{}), onboardingDone:true };
      await save(); toast('✅ Imported!'); onboardStep=0; renderView(); updateHdr();
    } catch(err) { toast('Not a valid Mio Tracker file.'); }
  };
  inp.click();
}

// ═══ CHECK-IN ENGINE ══════════════════════════════════════════════════════

function getNextMilestoneForDomain(domain) {
  const items = CDC_ITEMS.filter(x => x.domain === domain);
  const existing = data.milestones || [];
  for (const ci of items) {
    const found = existing.find(m => m.item === ci.item);
    if (!found || found.status !== 'reached') return ci;
  }
  return null;
}

function buildCheckinQuestions() {
  const questions = [...CI_DAILY];
  const t = today();
  const log = data.checkinLog || [];
  const lastShown = {};
  for (const entry of log) {
    for (const k of (entry.answeredKeys || [])) { if (!lastShown[k] || entry.date > lastShown[k]) lastShown[k] = entry.date; }
    for (const k of (entry.skippedKeys  || [])) { if (!lastShown[k] || entry.date > lastShown[k]) lastShown[k] = entry.date; }
  }
  const eligible = CI_ROTATING.filter(item => {
    const last = lastShown[item.id];
    if (!last) return true;
    return Math.floor((new Date(t) - new Date(last)) / 86400000) >= item.minDays;
  });
  const rotating = [];
  for (const item of eligible) {
    if (rotating.length >= 3) break;
    if (item.type === 'milestone') {
      const next = getNextMilestoneForDomain(item.domain);
      if (!next) continue;
      rotating.push({ ...item, milestoneItem: next });
    } else {
      rotating.push(item);
    }
  }
  return [...questions, ...rotating].slice(0, 8);
}

function initCheckin() {
  checkinState = {
    questions: buildCheckinQuestions(),
    step: 0,
    wellbeing: { id:uid(), date:today(), sleepBand:null, appetite:null, mood:null, activeBand:null, screenBand:null, readTogether:null, note:'' },
    newWords: [],
    newMilestones: [],
    growthEntry: null,
    answeredKeys: [],
    skippedKeys: [],
    _screenVal: null,
    _readVal: null,
  };
}

// Re-open today's check-in to adjust answers. Prefills from the saved record
// so existing answers are preserved; the merge-only-non-null logic in
// finishCheckin protects anything left untouched.
function editTodayCheckin() {
  initCheckin();
  const todayWB = (data.wellbeing || []).find(w => w.date === today());
  if (todayWB) {
    for (const k of ['sleepBand','appetite','mood','activeBand','screenBand','readTogether','note']) {
      if (todayWB[k] != null) checkinState.wellbeing[k] = todayWB[k];
    }
    if (todayWB.screenBand != null) checkinState._screenVal = todayWB.screenBand;
    if (todayWB.readTogether != null) checkinState._readVal = todayWB.readTogether;
  }
  if (data.settings) data.settings.checkinDoneDate = null;
  renderView();
}

  if (step >= questions.length) { finishCheckin(); return ''; }
  const q = questions[step];

  const dots = questions.map((_,i) =>
    `<div style="width:7px;height:7px;border-radius:50%;flex-shrink:0;background:${i<step?'var(--accent)':i===step?'var(--accent-l)':'var(--border)'};transition:background .2s"></div>`

}

function ciRemoveWord(wid) {
  if (!checkinState) return;
  checkinState.newWords = checkinState.newWords.filter(w => w.id !== wid);
  renderView();
}

function ciWordsNext() {
  if (!checkinState) return;
  checkinState.answeredKeys.push('words');
  ciAdvance();
}

function ciBoolAnswer(id, field, val) {
  if (!checkinState) return;
  checkinState.wellbeing[field] = val;
  checkinState.answeredKeys.push(id);
  ciAdvance();
}

function ciMilestoneAnswer(id, status) {
  if (!checkinState) return;
  const ci = _ciMS[id];
  if (!ci) return;
  checkinState.newMilestones.push({ item:ci.item, domain:ci.domain, status });
  checkinState.answeredKeys.push(id);
  ciAdvance();
}

function ciGrowthNext() {
  if (!checkinState) return;
  const wt = parseFloat(document.getElementById('ci-wt')?.value);
  const ht = parseFloat(document.getElementById('ci-ht')?.value);
  const hd = parseFloat(document.getElementById('ci-hd')?.value);
  if (wt || ht || hd) {
    checkinState.growthEntry = { id:uid(), date:today(), ageMonths:ageMonths(data.child?.dob||MIO_DOB), weightKg:wt||null, heightCm:ht||null, headCm:hd||null, note:'Daily check-in' };
  }
  checkinState.answeredKeys.push('growth');
  ciAdvance();
}

function ciSafetyAnswer(key, confirmed) {
  if (!checkinState) return;
  if (!data.safetyStatus) data.safetyStatus = {};
  if (confirmed) data.safetyStatus[key] = today();
  else toast('📋 Noted — worth sorting soon!');
  checkinState.answeredKeys.push('safety');
  ciAdvance();
}

function ciSkip(id) {
  if (!checkinState) return;
  checkinState.skippedKeys.push(id);
  ciAdvance();
}

function ciAdvance() {
  if (!checkinState) return;
  checkinState.step++;
  if (checkinState.step >= checkinState.questions.length) finishCheckin();
  else renderView();
}

async function finishCheckin() {
  if (!checkinState) return;
  const t = today();
  const wb = checkinState.wellbeing;
  const hasWB = wb.sleepBand || wb.appetite || wb.mood || wb.activeBand || wb.screenBand != null || wb.readTogether != null || wb.twoWordCombos != null;
  if (hasWB) {
    if (!data.wellbeing) data.wellbeing = [];
    const ex = data.wellbeing.find(w => w.date === t);
    // Merge only the fields actually answered, so re-opening to edit never
    // wipes a previously-answered field that was skipped this time around.
    if (ex) { for (const k in wb) { if (k !== 'id' && wb[k] != null) ex[k] = wb[k]; } }
    else data.wellbeing.push(wb);
  }
  for (const w of checkinState.newWords) {
    if (!data.words) data.words = [];
    if (!data.words.some(x => x.word.toLowerCase() === w.word.toLowerCase())) data.words.push(w);
  }
  for (const ms of checkinState.newMilestones) {
    if (!data.milestones) data.milestones = [];
    const ex = data.milestones.find(m => m.item === ms.item);
    if (ex) { ex.status = ms.status; ex.date = t; }
    else data.milestones.push({ id:uid(), date:t, ageMonths:ageMonths(data.child?.dob||MIO_DOB), domain:ms.domain, item:ms.item, status:ms.status, note:'' });
  }
  if (checkinState.growthEntry) {
    if (!data.growth) data.growth = [];
    // Dedupe by date so editing today's check-in can't create a duplicate
    // measurement: same-day re-entry merges fields instead of adding a row.
    const g = checkinState.growthEntry;
    const exg = data.growth.find(x => x.date === g.date);
    if (exg) { for (const k in g) { if (k !== 'id' && g[k] != null) exg[k] = g[k]; } }
    else data.growth.push(g);
  }
  if (!data.checkinLog) data.checkinLog = [];
  const exLog = data.checkinLog.find(l => l.date === t);
  if (exLog) { exLog.answeredKeys.push(...checkinState.answeredKeys); exLog.skippedKeys.push(...checkinState.skippedKeys); }
  else data.checkinLog.push({ date:t, answeredKeys:checkinState.answeredKeys, skippedKeys:checkinState.skippedKeys });
  if (!data.settings) data.settings = {};
  data.settings.checkinDoneDate = t;
  checkinState = null;
  await save();
  renderView(); updateHdr();
  toast('✅ Check-in saved!');
}

function voiceSupported() {
  return ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window);
}

// Optional speech-to-text. Drops the result into the target input for the
// parent to confirm and tap Add — never auto-saves (accuracy first).
function startVoice(targetId, langSelId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice input is not available on this browser.'); return; }
  const inp = document.getElementById(targetId);
  let lang = 'en-US';
  const ls = langSelId && document.getElementById(langSelId);
  if (ls && /fil|tag/i.test(ls.value)) lang = 'fil-PH';
  const rec = new SR();
  rec.lang = lang; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => {
    const t = (e.results[0][0].transcript || '').trim().replace(/[.\s]+$/, '');
    if (inp) { inp.value = t; inp.focus(); }
  };
  rec.onerror = () => toast("Didn't catch that — try again.");
  toast('Listening…');
  try { rec.start(); } catch (e) {}
}

function setWordFilter(key, val) { _wordFilter[key] = val; renderView(); }
function setWordSort()           { _wordFilter.sort = _wordFilter.sort === 'az' ? 'new' : 'az'; renderView(); }
function onWordSearch(v) {
  _wordFilter.q = v; renderView();
  const el = document.getElementById('words-search');
  if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) {} }
}

// Draft category for the add row / edit modal — toggled in the DOM so it never
// re-renders the form and clears a half-typed word.
function setDraftCat(id) {
  _wordDraftCat = id;
  document.querySelectorAll('[data-dcat]').forEach(b => {

}
let _wordDraftClarity = null;
function setDraftClarity(val) {

}

// Cumulative vocabulary growth — a step curve built from firstHeard dates.
function buildVocabChart(all) {
  const dated = all.filter(w => w.firstHeard).slice().sort((a,b) => a.firstHeard.localeCompare(b.firstHeard));
  if (dated.length < 2) {
    return `<div style="font-size:12px;color:var(--muted);line-height:1.6">Once a few words have dates on them, a growth curve appears here. Keep adding words as Mio says them.</div>`;
  }
  const W=300,H=120,ML=22,MT=8,CW=W-ML-8,CH=H-MT-16;
  const t0 = new Date(dated[0].firstHeard+'T12:00:00').getTime();
  const t1 = Date.now();
  const span = Math.max(86400000, t1 - t0);
  const total = dated.length;
  const xp = t => ML + ((t - t0) / span) * CW;
  const yp = c => MT + CH * (1 - c / Math.max(total,1));
  let path = `M${ML.toFixed(1)},${yp(0).toFixed(1)}`;
  let prevC = 0;
  const dots = [];
  dated.forEach((w,i) => {
    const x = xp(new Date(w.firstHeard+'T12:00:00').getTime());
    const c = i + 1;
    path += ` L${x.toFixed(1)},${yp(prevC).toFixed(1)} L${x.toFixed(1)},${yp(c).toFixed(1)}`;
    prevC = c;
    dots.push(`<circle cx="${x.toFixed(1)}" cy="${yp(c).toFixed(1)}" r="2.3" fill="#C58A5C"/>`);
  });
  path += ` L${xp(t1).toFixed(1)},${yp(prevC).toFixed(1)}`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">
    <line x1="${ML}" y1="${MT}" x2="${ML}" y2="${(MT+CH).toFixed(1)}" stroke="rgba(168,158,145,.4)" stroke-width="1"/>
    <line x1="${ML}" y1="${(MT+CH).toFixed(1)}" x2="${(ML+CW).toFixed(1)}" y2="${(MT+CH).toFixed(1)}" stroke="rgba(168,158,145,.4)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="#C58A5C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots.join('')}
    <text x="${ML-4}" y="${(yp(total)+3).toFixed(1)}" font-size="8" fill="rgba(168,158,145,.9)" text-anchor="end">${total}</text>
    <text x="${ML-4}" y="${(yp(0)+3).toFixed(1)}" font-size="8" fill="rgba(168,158,145,.9)" text-anchor="end">0</text>
    <text x="${ML}" y="${H-3}" font-size="8" fill="rgba(168,158,145,.7)">${dated[0].firstHeard}</text>
    <text x="${(ML+CW).toFixed(1)}" y="${H-3}" font-size="8" fill="rgba(168,158,145,.7)" text-anchor="end">today</text>
  </svg>`;
}

function buildWords() {
  const all = (data.words || []);
  const total = all.length;
  const f = _wordFilter;
  const voiceOK = voiceSupported();

  // milestone badges (use total for "reached", nth dated word for the date)
  const dated = all.filter(w => w.firstHeard).slice().sort((a,b) => a.firstHeard.localeCompare(b.firstHeard));
  const marks = [10,25,50,100].map(n => ({ n, reached: total >= n, date: total >= n ? (dated[n-1]?.firstHeard || '') : '' }));
  const nextMark = marks.find(m => !m.reached);
  const combo = (data.wellbeing||[]).filter(w => w.twoWordCombos).map(w => w.date).sort()[0] || null;

  // new this week
  const weekAgo = (() => { const d = new Date(); d.setDate(d.getDate()-7); return d.toISOString().slice(0,10); })();
  const newThisWeek = all.filter(w => (w.firstHeard||'') >= weekAgo).length;

  // filtered + sorted list
  let list = all.slice();
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(w => (w.word||'').toLowerCase().includes(q) || (w.meaning||'').toLowerCase().includes(q)); }
  if (f.lang !== 'all') list = list.filter(w => (w.language||'Other') === f.lang);
  if (f.cat  !== 'all') list = list.filter(w => catOf(w) === f.cat);
  if (f.sort === 'az') list.sort((a,b) => (a.word||'').localeCompare(b.word||''));
  else                 list.sort((a,b) => (b.firstHeard||'').localeCompare(a.firstHeard||''));

  const langsPresent = [...new Set(all.map(w => w.language||'Other'))];

  const chip = (on, extra) => `display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;border:1.5px solid ${on?'var(--accent)':'var(--border)'};background:${on?'var(--accent)':'var(--surface2)'};color:${on?'var(--on-accent)':'var(--text)'};${extra||''}`;

  const filterLangChips = ['all', ...langsPresent].map(l =>
    `<button onclick="setWordFilter('lang','${l}')" style="${chip(f.lang===l)}">${l==='all'?'All langs':esc(l)}</button>`).join('');
  const filterCatChips = ['all', ...WORD_CATS.map(c=>c.id)].map(cid => {
    const lbl = cid==='all' ? 'All' : catMeta(cid).emoji+' '+catMeta(cid).label;
    return `<button onclick="setWordFilter('cat','${cid}')" style="${chip(f.cat===cid)}">${lbl}</button>`;
  }).join('');

  const draftCatChips = WORD_CATS.map(c =>
    `<button data-dcat="${c.id}" onclick="setDraftCat('${c.id}')" style="${chip(_wordDraftCat===c.id)}">${c.emoji} ${c.label}</button>`).join('');

  const micBtn = (target, langSel) => voiceOK
    ? `<button onclick="startVoice('${target}','${langSel}')" title="Voice" style="background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--rs);padding:0 12px;font-size:16px;cursor:pointer;font-family:inherit">🎤</button>`
    : '';

  const milestoneRow = `
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
      ${marks.filter(m=>m.reached).map(m => `<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok-tx)">★ ${m.n} words${m.date?` · ${m.date}`:''}</span>`).join('')}
      ${combo ? `<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok-tx)">★ first 2-word combo · ${combo}</span>` : ''}
      ${nextMark ? `<span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface2);border:1px dashed var(--border);color:var(--muted)">next: ${nextMark.n} words (${nextMark.n-total} to go)</span>` : ''}
    </div>`;

  return `
    <div style="padding:12px 13px 0">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div class="scard"><div class="s-lbl">Words</div><div class="s-val" style="color:var(--accent-l)">${total}</div><div class="s-sub">all languages</div></div>
        <div class="scard"><div class="s-lbl">New this week</div><div class="s-val" style="color:var(--blue)">${newThisWeek}</div><div class="s-sub">last 7 days</div></div>
      </div>

      <div class="card" style="margin-bottom:10px">
        <div class="card-title">Vocabulary growth</div>
        ${buildVocabChart(all)}
        ${total>0 ? milestoneRow : ''}
      </div>

      <div class="card" style="margin-bottom:10px">
        <div class="card-title">Add a word</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px">All languages. ${voiceOK?'Type or tap the mic.':'Type it in.'} You can set the kind of word below.</div>
        <div style="display:flex;gap:6px;margin-bottom:6px">
          <input class="mi" id="words-word" placeholder="Word or sound" style="flex:2">
          <input class="mi" id="words-meaning" placeholder="Meaning?" style="flex:1">
        </div>
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <select class="mi" id="words-lang" style="flex:1"><option value="Filipino">Filipino</option><option value="English">English</option><option value="Other">Other</option></select>
          ${micBtn('words-word','words-lang')}
          <button onclick="wordsAddWord()" style="background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--rs);padding:10px 16px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">+ Add</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${draftCatChips}</div>
      </div>

      ${total === 0 ? `
      <div class="card" style="text-align:center;padding:28px 16px">
        <div style="font-size:40px;margin-bottom:10px">🔤</div>
        <div style="font-size:15px;font-weight:700;margin-bottom:5px">No words yet</div>
        <div style="font-size:12px;color:var(--muted);line-height:1.6">Add the first word or sound you want to remember. Even an approximation counts.</div>
      </div>` : `
      <div class="card" style="margin-bottom:10px">
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <input class="mi" id="words-search" value="${esc(f.q)}" oninput="onWordSearch(this.value)" placeholder="Search words…" style="flex:1">
          <button onclick="setWordSort()" style="background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--rs);padding:0 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">${f.sort==='az'?'A–Z':'Newest'}</button>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">${filterLangChips}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${filterCatChips}</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${list.length} of ${total} shown · tap a word to edit</div>
        <div>
          ${list.length === 0 ? `<div style="font-size:13px;color:var(--muted);font-style:italic;padding:8px 0">No words match that filter.</div>` :
          list.map(w => `
            <div onclick="openWordModal('${w.id}')" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer">
              <div style="min-width:0">
                <div style="font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                  <span>${esc(w.word)}</span>
                  ${w.clarity==='approx' ? `<span style="font-size:9px;font-weight:700;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:1px 5px">approx</span>` : ''}
                </div>
                ${w.meaning ? `<div style="font-size:12px;color:var(--muted)">${esc(w.meaning)}</div>` : ''}
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
                <span style="font-size:13px" title="${esc(catMeta(catOf(w)).label)}">${catMeta(catOf(w)).emoji}</span>
                <span style="font-size:11px;color:var(--accent-l)">${esc(w.language||'')}</span>
              </div>
            </div>`).join('')}
        </div>
      </div>`}

    </div>
    <div class="gap"></div>
  `;
}

    <div class="mdt">Edit word</div>
